<div class="aaw-wrap">
<div id="aaw-hub"></div>
<style>/*<![CDATA[*/
#aaw-hub{--c:#1f6f8b;--ok:#2e7d32;--bad:#c62828;--bg:#f6f9fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;max-width:720px;margin:0 auto;color:#1d2a33;line-height:1.45}
#aaw-hub *{box-sizing:border-box}
#aaw-hub .card{background:var(--bg);border:1px solid #d7e3ea;border-radius:12px;padding:20px}
#aaw-hub h2{margin:0 0 4px;font-size:1.35em;color:var(--c)}
#aaw-hub h3{margin:0;font-size:1.05em}
#aaw-hub .sub{margin:0 0 14px;color:#5a6b76;font-size:.92em}
#aaw-hub .center{text-align:center}
#aaw-hub button{font:inherit;cursor:pointer;border-radius:8px;color:inherit}
#aaw-hub .btn{padding:11px 20px;border:0;background:var(--c);color:#fff;font-weight:600;margin-top:14px}
#aaw-hub .btn.ghost{background:transparent;color:var(--c);border:1.5px solid var(--c);margin-left:8px}
#aaw-hub .back{border:0;background:none;color:var(--c);font-weight:600;padding:0;margin-bottom:10px}
#aaw-hub .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#aaw-hub .tile{text-align:left;padding:16px;border:1.5px solid #c5d5de;background:#fff}
#aaw-hub .tile:hover{border-color:var(--c)}
#aaw-hub .tile .ic{font-size:1.8em}
#aaw-hub .tile p{margin:4px 0 0;font-size:.88em;color:#5a6b76}
#aaw-hub .bar{height:6px;background:#dde8ee;border-radius:3px;margin-bottom:12px;overflow:hidden}
#aaw-hub .bar i{display:block;height:100%;background:var(--c);transition:width .3s}
#aaw-hub .meta{display:flex;justify-content:space-between;font-size:.85em;color:#5a6b76;margin-bottom:10px}
#aaw-hub .tag{display:inline-block;font-size:.75em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
#aaw-hub .q{font-size:1.06em;font-weight:600;margin:0 0 14px}
#aaw-hub .opts{display:grid;gap:8px}
#aaw-hub .opt{text-align:left;padding:12px 14px;border:1.5px solid #c5d5de;background:#fff;min-height:44px}
#aaw-hub .opt:hover:not(:disabled){border-color:var(--c)}
#aaw-hub .opt:disabled{cursor:default}
#aaw-hub .opt.sel{border-color:var(--c);background:#e3f1f6}
#aaw-hub .opt.ok{border-color:var(--ok);background:#e8f5e9}
#aaw-hub .opt.bad{border-color:var(--bad);background:#ffebee}
#aaw-hub .exp{margin-top:14px;padding:12px 14px;background:#fff;border-left:4px solid var(--c);border-radius:6px;font-size:.95em}
#aaw-hub b.ok{color:var(--ok)}#aaw-hub b.bad{color:var(--bad)}
#aaw-hub .src{display:block;margin-top:6px;font-size:.82em;color:#6b7c87}
#aaw-hub .big{font-size:2.4em;font-weight:700;color:var(--c);margin:8px 0}
#aaw-hub .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#aaw-hub .scr{font-size:1.8em;font-weight:700;letter-spacing:.25em;color:var(--c);margin:10px 0;word-break:break-all}
#aaw-hub input{font:inherit;padding:11px 12px;border:1.5px solid #c5d5de;border-radius:8px;width:100%;text-transform:uppercase}
@keyframes aaw-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#aaw-hub .shake{animation:aaw-shake .25s 2}
#aaw-hub{position:relative}
#aaw-hub .btn:disabled{opacity:.4;cursor:default}
#aaw-hub .tile.feat{border-color:var(--c);background:#eef7fa}
/* wheel */
#aaw-hub .board{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;padding:14px;background:#123f50;border-radius:10px;margin-bottom:10px}
#aaw-hub .wd{display:flex;gap:4px}
#aaw-hub .lt{width:28px;height:36px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em;color:#123f50}
#aaw-hub .lt.pn{background:transparent;color:#fff;width:auto}
#aaw-hub .whw{position:relative;width:280px;height:280px;margin:6px auto}
#aaw-hub .wc{width:280px;height:280px;display:block}
#aaw-hub .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #c62828;z-index:2}
#aaw-hub .wctl{text-align:center}#aaw-hub .wctl .btn{margin:10px 4px 0}
#aaw-hub .kb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:12px}
#aaw-hub .key{padding:8px 0;border:1.5px solid #c5d5de;background:#fff;font-weight:700}
#aaw-hub .key:disabled{opacity:.35;cursor:default}#aaw-hub .key.used{text-decoration:line-through}
#aaw-hub .slv{display:flex;gap:8px;margin-top:10px}#aaw-hub .slv .btn{margin:0}
@media(max-width:480px){#aaw-hub .lt{width:22px;height:30px;font-size:1em}}
/* blaster */
#aaw-hub .bw{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(#eaf4f8,#fdf3f3);border:1px solid #d7e3ea;touch-action:manipulation}
#aaw-hub .bc{display:block;width:100%;height:380px;cursor:crosshair}
#aaw-hub .wp{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#aaw-hub .wbtn{flex:1 1 110px;padding:10px 6px;border:2px solid var(--w);background:#fff;font-weight:600;font-size:.9em}
#aaw-hub .wbtn.on{background:var(--w);color:#fff}
#aaw-hub .wbtn small{opacity:.6}
/* whack */
#aaw-hub .wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
#aaw-hub .hole{position:relative;height:104px;background:radial-gradient(ellipse at 50% 85%,#0b2a36 0 45%,#1f6f8b 46%);border-radius:10px;overflow:hidden}
#aaw-hub .pop{position:absolute;left:6px;right:6px;top:6px;bottom:6px;background:#fff;border:0;border-radius:8px;padding:6px;font-size:.8em;font-weight:600;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;transform:translateY(110%);transition:transform .15s}
#aaw-hub .pop.up{transform:none}
#aaw-hub .pop.good{background:#e8f5e9;color:var(--ok)}#aaw-hub .pop.oops{background:#ffebee;color:var(--bad)}
#aaw-hub .stop{display:block;width:100%;padding:16px;font-size:1.2em;margin-top:12px}
#aaw-hub .code{margin:12px auto;padding:12px 16px;border:2px dashed #e67e22;background:#fff8ec;border-radius:10px;max-width:380px;text-align:center}
#aaw-hub .code b{display:block;letter-spacing:.18em;font-size:1.5em;color:#b45309;margin:4px 0}
#aaw-hub .pp{margin-top:14px;padding:12px 14px;background:#fff;border:2px dashed #e67e22;border-radius:10px;font-size:.92em}
#aaw-hub .chip{display:inline-block;padding:3px 9px;margin:3px 3px 0 0;border-radius:12px;background:#fff1dc;color:#b45309;font-weight:700;letter-spacing:.08em;font-size:.85em}
#aaw-hub .tile{position:relative}#aaw-hub .tile .gotit{position:absolute;top:8px;right:10px;font-size:.8em;font-weight:700;color:var(--ok)}
#aaw-hub .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(246,249,251,.94);text-align:center;padding:20px}
/*]]>*/</style>
<script>//<![CDATA[
(function(){
  /* ===== EDIT ME: link to your Microsoft Form for code submissions (leave '' to hide the link) ===== */
  var FORM_URL='';
  var root=document.getElementById('aaw-hub'),cleanup=null;
  /* Secret code words, one per game, and the score needed to unlock each */
  var CODES={wheel:'NARROW',blast:'TARGETED',whack:'TIMEOUT',catch:'SHIELD',clock:'SHORTER',myth:'DELABEL',match:'PATHOGEN',dash:'DEESCALATE',dur:'DURATION',scr:'STEWARD'};
  var got={};
  /* Reports game activity (start/finish). Does nothing in the standalone file; the Vercel site listens for it to track plays and fill in codes. */
  function track(type,game,extra){try{var d={type:type,game:game};for(var k in extra)d[k]=extra[k];root.dispatchEvent(new CustomEvent('aaw',{bubbles:true,detail:d}))}catch(e){}}
  function award(id,ok,need){
    track('finish',id,{unlocked:!!ok,code:ok?CODES[id]:null});
    if(!ok)return '<p class="sub">🎟️ '+need+' to unlock this game\'s secret code word.</p>';
    got[id]=1;var n=Object.keys(got).length,t=Object.keys(CODES).length;
    return '<div class="code">🎟️ Secret code unlocked!<b>'+CODES[id]+'</b><span class="sub">Write it down! You have '+n+' of '+t+' codes.</span></div>';
  }
  function confetti(){
    var c=document.createElement('canvas');c.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5';root.appendChild(c);
    var w=c.width=root.clientWidth,h=c.height=root.clientHeight,x=c.getContext('2d'),P=[],t0=performance.now();
    for(var i=0;i<140;i++)P.push({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*5,c:['#1f6f8b','#f2c94c','#eb5757','#27ae60','#9b51e0'][i%5]});
    (function f(t){x.clearRect(0,0,w,h);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
      if(t-t0<2600&&c.parentNode)requestAnimationFrame(f);else if(c.parentNode)c.parentNode.removeChild(c)})(t0);
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function $(s){return root.querySelector(s)}
  function $$(s){return root.querySelectorAll(s)}
  var BACK='<button class="back">← All games</button>';
  function wireBack(){var b=$('.back');if(b)b.onclick=menu}
  function finish(title,score,total,msgs,extra){
    var p=score/total,msg=p===1?msgs[0]:p>=.7?msgs[1]:p>=.4?msgs[2]:msgs[3];
    return '<div class="card center">'+BACK+'<h2>'+title+'</h2><div class="big">'+score+' / '+total+'</div><p>'+msg+'</p>'+(extra||'')+
      '<button class="btn again">Play again</button><button class="btn ghost home">More games</button></div>';
  }
  var MSGS=['Stewardship superstar! 🏆','Great work, stewardship ally!','Solid start. You picked up a few new pearls.','Thanks for playing! Every bit of awareness helps.'];

  /* ---------- MENU ---------- */
  var GAMES=[
    {ic:'🎡',name:'Stewardship Wheel',d:'Spin, guess letters, solve the stewardship puzzle.',fn:wheel,f:1,id:'wheel'},
    {ic:'💥',name:'Bug Blaster',d:'Treat the falling bugs with the narrowest drug, before they escape.',fn:blaster,f:1,id:'blast'},
    {ic:'🔨',name:'Order Whack',d:'Whack the inappropriate antibiotic orders. Leave the good ones alone!',fn:whack,f:1,id:'whack'},
    {ic:'🛡️',name:'Stewardship Catch',d:'Catch good stewardship practices and dodge the bad ones.',fn:catcher,f:1,id:'catch'},
    {ic:'⏱️',name:'Stop the Clock',d:'Stop the moving marker on the right treatment duration.',fn:clock,f:1,id:'clock'},
    {ic:'🧠',name:'Myth or Fact',d:'Bust common antibiotic myths.',fn:function(){quiz('Myth or Fact',MYTHS,'myth')},id:'myth'},
    {ic:'🎯',name:'Bug–Drug Match',d:'Pair each organism with its go-to targeted therapy.',fn:match,id:'match'},
    {ic:'📉',name:'De-escalation Dash',d:'Cultures are back. Pick the narrowest effective option.',fn:function(){quiz('De-escalation Dash',DASH,'dash')},id:'dash'},
    {ic:'⏱️',name:'Duration Station',d:'How short can you go? Evidence-based durations.',fn:function(){quiz('Duration Station',DUR,'dur')},id:'dur'},
    {ic:'🔤',name:'Stewardship Scramble',d:'Unscramble key stewardship terms.',fn:scramble,id:'scr'}
  ];
  function menu(){
    if(cleanup){cleanup();cleanup=null}
    var h='<div class="card"><h2>🦠 Antibiotic Awareness Week Arcade</h2><p class="sub">Pick any game. Each takes about 1–2 minutes.</p><div class="menu">';
    GAMES.forEach(function(g,i){h+='<button class="tile'+(g.f?' feat':'')+'" data-i="'+i+'">'+(got[g.id]?'<span class="gotit">🎟️ ✓</span>':'')+'<div class="ic">'+g.ic+'</div><h3>'+g.name+'</h3><p>'+g.d+'</p></button>'});
    var ids=Object.keys(CODES),mine=ids.filter(function(k){return got[k]}),chips=mine.map(function(k){return '<span class="chip">'+CODES[k]+'</span>'}).join('');
    h+='</div><div class="pp"><b>🎟️ Code Word Passport: '+mine.length+' of '+ids.length+' collected</b><br>Hit the target score in any game to unlock its secret code word, and keep track of every code you earn. Whoever submits the most secret code words by the end of Antibiotic Awareness Week will be recognized! 🏆'+
      (chips?'<div style="margin-top:6px">'+chips+'</div>':'')+
      (FORM_URL?'<div style="margin-top:8px"><a href="'+FORM_URL+'" target="_blank" rel="noopener" style="color:var(--c);font-weight:700">Submit your codes →</a></div>':'')+
      '<div class="sub" style="margin:6px 0 0">Codes aren\'t saved when you leave or refresh the page, so write them down!</div></div>';
    root.innerHTML=h+'<p class="sub aaw-credit" style="margin:14px 0 0">Created by Shemual Tsai, PharmD. Questions or issues? <a href="mailto:shemual@gmail.com" style="color:var(--c)">shemual@gmail.com</a></p></div>';
    $$('.tile').forEach(function(b){b.onclick=function(){var g=GAMES[+b.dataset.i];track('start',g.id);g.fn()}});
  }

  /* ---------- QUIZ ENGINE (Myth/Fact, Dash, Duration) ---------- */
  var MYTHS=[
    {t:'Myth or Fact',q:'About 10% of patients report a penicillin allergy, and most of them are truly allergic.',o:['Myth','Fact'],a:0,e:'About 10% report it, but fewer than 1 in 10 of them are truly allergic when evaluated. Delabeling opens up first-line, narrower-spectrum options.',s:'CDC, Is It Really a Penicillin Allergy?'},
    {t:'Myth or Fact',q:"A patient with a penicillin allergy label can't receive cefazolin.",o:['Myth','Fact'],a:0,e:'Cefazolin has a unique side chain and very low cross-reactivity with penicillins. It can usually be given even with a history of penicillin anaphylaxis.',s:'AAAAI/ACAAI Drug Allergy Practice Parameter, 2022'},
    {t:'Myth or Fact',q:'Asymptomatic bacteriuria in a non-pregnant adult should usually be treated.',o:['Myth','Fact'],a:0,e:'Screening and treatment are recommended only in pregnancy and before urologic procedures that cause mucosal trauma.',s:'IDSA ASB Guideline, 2019'},
    {t:'Myth or Fact',q:'A positive C. difficile PCR in a patient without diarrhea means they need treatment.',o:['Myth','Fact'],a:0,e:'PCR detects the organism, not active disease, and colonization is common. Test only patients with ≥3 unformed stools in 24 hours and no laxatives.',s:'IDSA/SHEA CDI Guideline'},
    {t:'Myth or Fact',q:'Each additional day of antibiotic therapy adds to the risk of adverse drug events.',o:['Myth','Fact'],a:1,e:'In hospitalized adults, every additional 10 days of therapy was linked to about a 3% higher risk of an adverse drug event.',s:'Tamma et al., JAMA Intern Med 2017'},
    {t:'Myth or Fact',q:'A negative MRSA nasal PCR makes MRSA pneumonia unlikely, which supports stopping empiric anti-MRSA therapy.',o:['Myth','Fact'],a:1,e:'MRSA nares PCR has a negative predictive value of about 96–99% for MRSA pneumonia.',s:'Parente et al., Clin Infect Dis 2018'},
    {t:'Myth or Fact',q:'Antibiotics help most cases of acute bronchitis in otherwise healthy adults.',o:['Myth','Fact'],a:0,e:"Acute bronchitis is usually viral. Antibiotics don't meaningfully shorten symptoms, and they do cause side effects.",s:'ACP/CDC High-Value Care Advice, 2016'},
    {t:'Myth or Fact',q:'Reassessing antibiotics at 48–72 hours (a "time-out") is a core stewardship practice.',o:['Myth','Fact'],a:1,e:'With cultures and the clinical course in hand, ask: still needed? Right drug? De-escalate? IV-to-PO? Planned stop date?',s:'CDC Core Elements of Hospital Antibiotic Stewardship'}
  ];
  var DASH=[
    {t:'Culture is back',q:'MSSA bacteremia. The patient is on vancomycin + piperacillin-tazobactam. Best targeted therapy?',o:['Cefazolin','Continue vancomycin','Meropenem','Daptomycin'],a:0,e:'Beta-lactams (cefazolin or an antistaphylococcal penicillin) outperform vancomycin for MSSA. Stop the pip-tazo too.',s:'IDSA MRSA/S. aureus guidance; McDanel et al., CID 2015'},
    {t:'Culture is back',q:'Pyelonephritis with pan-susceptible E. coli. The patient is on meropenem, now improving and eating. Best next step?',o:['Oral TMP-SMX (susceptible)','Continue meropenem','Switch to ertapenem','Add vancomycin'],a:0,e:'Step down to a susceptible oral agent. Save carbapenems for when you really need them.',s:'IDSA Complicated UTI Guidance, 2025'},
    {t:'Culture is back',q:'CAP with penicillin-susceptible S. pneumoniae. The patient is on ceftriaxone + azithromycin and is stable. Best step-down?',o:['Oral amoxicillin','Oral levofloxacin','Oral cefdinir','Continue IV therapy'],a:0,e:"Penicillin-susceptible pneumococcus means amoxicillin. It's narrow, well absorbed, and effective.",s:'ATS/IDSA CAP Guideline, 2019'},
    {t:'Culture is back',q:'CAP on vancomycin + ceftriaxone. MRSA nares PCR is negative and cultures show no MRSA. What do you do?',o:['Stop vancomycin','Switch vancomycin to linezolid','Continue vancomycin 7 days','Add cefepime'],a:0,e:'A negative MRSA nares result plus negative cultures supports stopping anti-MRSA coverage.',s:'ATS/IDSA CAP Guideline, 2019'},
    {t:'Culture is back',q:'Ampicillin-susceptible E. faecalis cystitis. The patient is on daptomycin. Best targeted therapy?',o:['Amoxicillin / ampicillin','Continue daptomycin','Linezolid','Ceftriaxone'],a:0,e:"Ampicillin is the drug of choice for susceptible E. faecalis. Note that cephalosporins don't cover enterococci.",s:'IDSA Complicated UTI Guidance, 2025'},
    {t:'Clinical course',q:'Nonpurulent cellulitis without MRSA risk factors, improving on IV vancomycin. Best oral step-down?',o:['Cephalexin','Linezolid','Levofloxacin','Amoxicillin-clavulanate + doxycycline'],a:0,e:'Nonpurulent cellulitis is mostly streptococcal. Cephalexin covers it, and routine MRSA coverage is not needed.',s:'IDSA SSTI Guideline, 2014'}
  ];
  var DUR=[
    {t:'Duration',q:'Hospitalized (non-ICU) community-acquired pneumonia, clinically stable by day 3 on a beta-lactam. What duration was noninferior to 8 days in an RCT?',o:['3 days','5 days','10 days','14 days'],a:0,e:'Stopping beta-lactam therapy at day 3 in clinically stable patients was noninferior to continuing for 8 days.',s:'Dinh et al., Lancet 2021 (PTC trial)'},
    {t:'Duration',q:'Uncomplicated Gram-negative bacteremia (urinary source) with a good response. Which duration was noninferior to 14 days?',o:['3 days','7 days','10 days','21 days'],a:1,e:'7 days was noninferior to 14 days in patients who were improving.',s:'Yahav et al., Clin Infect Dis 2019'},
    {t:'Duration',q:'Uncomplicated cellulitis, improving. What is the typical recommended duration?',o:['5–6 days','10 days','14 days','21 days'],a:0,e:'5–6 days is usually enough. Extend only if the infection has not improved.',s:'IDSA SSTI Guideline, 2014; ACP Best Practice Advice, 2021'},
    {t:'Duration',q:'Acute uncomplicated cystitis in a woman, treated with nitrofurantoin. What duration?',o:['5 days','7 days','10 days','14 days'],a:0,e:'Nitrofurantoin for 5 days is a first-line regimen.',s:'IDSA Uncomplicated Cystitis Guideline, 2010'},
    {t:'Duration',q:'Intra-abdominal infection with adequate source control. Which duration was as good as a longer course (STOP-IT)?',o:['About 4 days','About 10 days','About 14 days','Until WBC normalizes'],a:0,e:'About 4 days after source control was as good as treating until physiologic abnormalities resolved.',s:'Sawyer et al., NEJM 2015 (STOP-IT)'},
    {t:'Duration',q:'Hospital-acquired or ventilator-associated pneumonia. What is the recommended duration for most patients?',o:['7 days','10 days','14 days','21 days'],a:0,e:'7 days is recommended for most patients with HAP or VAP.',s:'IDSA/ATS HAP/VAP Guideline, 2016'}
  ];
  function quiz(title,bank,id){
    var qs=shuffle(bank),i=0,score=0;
    function show(){
      var q=qs[i],order=q.o.length>2?shuffle(q.o.map(function(_,k){return k})):[0,1];
      var h='<div class="card">'+BACK+'<div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div>'+
        '<div class="meta"><span>'+title+': '+(i+1)+' of '+qs.length+'</span><span class="sc">Score: '+score+'</span></div>'+
        '<span class="tag">'+esc(q.t)+'</span><p class="q">'+esc(q.q)+'</p><div class="opts">';
      order.forEach(function(k){h+='<button class="opt" data-k="'+k+'">'+esc(q.o[k])+'</button>'});
      root.innerHTML=h+'</div><div class="fb"></div></div>';wireBack();
      $$('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
    }
    function pick(k){
      var q=qs[i],right=k===q.a;if(right)score++;
      $$('.opt').forEach(function(b){var j=+b.dataset.k;b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
      $('.sc').textContent='Score: '+score;
      $('.fb').innerHTML='<div class="exp"><b class="'+(right?'ok">Correct!':'bad">Not quite.')+'</b> '+esc(q.e)+'<span class="src">Source: '+esc(q.s)+'</span></div>'+
        '<button class="btn nx">'+(i<qs.length-1?'Next →':'See results')+'</button>';
      $('.nx').onclick=function(){i++;i<qs.length?show():end()};
    }
    function end(){var need=Math.ceil(qs.length*.7);root.innerHTML=finish(title,score,qs.length,MSGS,award(id,score>=need,'Score '+need+'/'+qs.length+' or better'));wireBack();$('.again').onclick=function(){quiz(title,bank,id)};$('.home').onclick=menu}
    show();
  }

  /* ---------- BUG–DRUG MATCH ---------- */
  var PAIRS=[
    {b:'MSSA',d:'Cefazolin',p:'For MSSA, beta-lactams beat vancomycin.'},
    {b:'MRSA',d:'Vancomycin',p:'Use dosing guided by AUC.'},
    {b:'Pseudomonas aeruginosa',d:'Cefepime',p:'Check susceptibilities. Avoid double coverage once they are known.'},

  function clock(){

    function size(){if(!cv)return;w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}

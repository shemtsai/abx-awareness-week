<script>//<![CDATA[
(function(){
  var root=document.getElementById('aaw-hub'),cleanup=null;
  /* Internal game IDs. Not shown in the games; the website uses them for its leaderboard. */
  var CODES={wheel:'NARROW',blast:'TARGETED',run:'COVERAGE',whack:'TIMEOUT',catch:'SHIELD',clock:'SHORTER',allergy:'PENICILLIN',myth:'DELABEL',match:'PATHOGEN',dash:'DEESCALATE',dur:'DURATION',scr:'STEWARD'};
  /* Reports game activity (start/finish). Does nothing in the standalone file; the Vercel site listens for it to track plays and fill in codes. */
  function track(type,game,extra){try{var d={type:type,game:game};for(var k in extra)d[k]=extra[k];root.dispatchEvent(new CustomEvent('aaw',{bubbles:true,detail:d}))}catch(e){}}
  /* Reports a finished game and its score (used only by the website's leaderboard). Shows nothing. */
  /* Difficulty: Hard is faster (or tougher) and its scores count 1.5x on the leaderboard. Games without a "hard" note are Normal only. */
  var HARD=false,WANT_HARD=false;
  function SPD(){return HARD?1.35:1}
  /* Question pools: Normal draws mostly standard items plus a few harder ones; Hard draws mostly harder ones (l:2). */
  function pick(bank,n){
    var hi=shuffle(bank.filter(function(x){return x.l===2})),lo=shuffle(bank.filter(function(x){return x.l!==2})),
      a=HARD?hi:lo,b=HARD?lo:hi,k=Math.min(a.length,Math.round(n*(HARD?.7:.8))),out=a.slice(0,k).concat(b.slice(0,n-k));
    if(out.length<n)out=out.concat(a.slice(k,k+n-out.length));
    return shuffle(out);
  }
  function pool(bank){return bank.filter(function(x){return (x.l===2)===HARD||Math.random()<(HARD?.5:.3)})}
  function award(id,ok,need,score){
    var pts=HARD?Math.round(score*1.5):score;
    track('finish',id,{unlocked:!!ok,code:ok?CODES[id]:null,score:pts,hard:HARD});
    return HARD?'<p class="hb">Hard mode bonus: '+score.toLocaleString()+' \u00d7 1.5 = <b>'+pts.toLocaleString()+'</b> points</p>':'';
  }
  function confetti(){
    var c=document.createElement('canvas');c.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5';root.appendChild(c);
    var w=c.width=root.clientWidth,h=c.height=root.clientHeight,x=c.getContext('2d'),P=[],t0=performance.now();
    for(var i=0;i<140;i++)P.push({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*5,c:['#1f6f8b','#f2c94c','#eb5757','#27ae60','#9b51e0'][i%5]});
    (function f(t){x.clearRect(0,0,w,h);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
      if(t-t0<2600&&c.parentNode)requestAnimationFrame(f);else if(c.parentNode)c.parentNode.removeChild(c)})(t0);
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function $(s){return root.querySelector(s)}
  function $$(s){return root.querySelectorAll(s)}

  var MYTHS=[{"l": 1, "f": 0, "s": "Antibiotics work against colds and the flu.", "e": "Colds and flu are caused by viruses, and antibiotics don't work against viruses. They won't help, and they can still cause side effects.", "src": "CDC, Be Antibiotics Aware"}, {"l": 1, "f": 0, "s": "Green or yellow mucus means you need an antibiotic.", "e": "Mucus color changes during many viral illnesses. Color alone doesn't mean a bacterial infection.", "src": "CDC, Be Antibiotics Aware"}, {"l": 1, "f": 1, "s": "About 1 in 5 hospitalized patients who receive antibiotics has an antibiotic-related adverse event.", "e": "In a study of nearly 1,500 hospitalized adults, 20% had at least one antibiotic-associated adverse event, and about 1 in 5 antibiotic courses wasn't clinically needed.", "src": "Tamma et al., JAMA Intern Med 2017"}, {"l": 2, "f": 1, "s": "Each additional 10 days of antibiotic therapy raises the risk of an adverse event by about 3%.", "e": "Risk climbs with every extra day of therapy, which is one reason shorter effective courses matter.", "src": "Tamma et al., JAMA Intern Med 2017"}, {"l": 1, "f": 0, "s": "Most people with a penicillin allergy on their chart are truly allergic.", "e": "About 10% of patients report a penicillin allergy, but fewer than 1% of the whole population is truly allergic.", "src": "CDC, Is It Really a Penicillin Allergy?"}, {"l": 2, "f": 1, "s": "About 80% of people with a true IgE-mediated penicillin allergy lose it within 10 years.", "e": "Penicillin allergy wanes over time, so old labels are worth re-evaluating.", "src": "CDC, Is It Really a Penicillin Allergy?"}, {"l": 2, "f": 1, "s": "A penicillin allergy label is linked to a higher risk of MRSA and C. difficile.", "e": "Patients with the label had a 69% higher risk of MRSA and a 26% higher risk of C. difficile, driven largely by the alternative antibiotics they received.", "src": "Blumenthal et al., BMJ 2018"}, {"l": 1, "f": 0, "s": "Antibiotic resistance means a person's body has become resistant to antibiotics.", "e": "Bacteria and fungi become resistant, not the body. Resistant germs can then spread to other people.", "src": "CDC, About Antimicrobial Resistance"}, {"l": 1, "f": 1, "s": "Drug-resistant bacteria and fungi cause millions of infections in the United States each year.", "e": "CDC's 2026 report estimates about 9.7 million drug-resistant infections and more than 50,000 deaths each year (2023 data).", "src": "CDC Antimicrobial Resistance Threats Report, 2026"}, {"l": 2, "f": 0, "s": "A family history of penicillin allergy means a person should avoid penicillin.", "e": "A relative's allergy doesn't raise a patient's own risk. No avoidance or testing is needed for family history alone.", "src": "Drug Allergy Practice Parameter, J Allergy Clin Immunol 2022"}, {"l": 2, "f": 0, "s": "Penicillin skin testing is the only way to remove a penicillin allergy label.", "e": "For low-risk histories, a direct oral amoxicillin challenge was noninferior to skin testing followed by challenge.", "src": "Copaescu et al., JAMA Intern Med 2023 (PALACE trial)"}, {"l": 2, "f": 0, "s": "A patient with a penicillin allergy label can't receive cefazolin.", "e": "Cefazolin has a unique side chain with negligible cross-reactivity with penicillins. It can be given without testing, even after penicillin anaphylaxis. The exception is a severe delayed reaction such as SJS/TEN or DRESS, which needs specialist evaluation.", "src": "Drug Allergy Practice Parameter, J Allergy Clin Immunol 2022"}, {"l": 1, "f": 1, "s": "Alcohol-based hand sanitizer doesn't reliably remove C. difficile spores.", "e": "Alcohol doesn't remove or inactivate the spores in lab studies. CDC still prefers hand sanitizer for routine care and recommends soap and water during C. difficile outbreaks, with gloves and gowns for contact precautions.", "src": "CDC, Hand Hygiene in Healthcare Settings"}, {"l": 1, "f": 1, "s": "Most acute bronchitis in otherwise healthy adults is caused by viruses.", "e": "Antibiotics don't meaningfully shorten acute bronchitis, and they do cause side effects.", "src": "ACP/CDC High-Value Care Advice, 2016"}, {"l": 1, "f": 0, "s": "Antibiotics only affect the bacteria causing the infection.", "e": "Antibiotics also kill helpful bacteria, which can lead to C. difficile infection and resistance.", "src": "CDC, Be Antibiotics Aware"}, {"l": 1, "f": 1, "s": "Reassessing antibiotics at 48 to 72 hours (a time-out) is a core stewardship practice.", "e": "With cultures and the clinical course in hand, ask: still needed? Right drug? Narrow? Switch to oral? Stop date?", "src": "CDC Core Elements of Hospital Antibiotic Stewardship"}, {"l": 2, "f": 1, "s": "Drug-resistant fungi, such as Candida auris, are among CDC's urgent resistance threats.", "e": "Resistance isn't only a bacterial problem. C. auris can resist all major antifungal classes and spreads in healthcare facilities.", "src": "CDC Antimicrobial Resistance Threats Report"}, {"l": 1, "f": 1, "s": "Antibiotic use in animals and agriculture can contribute to resistance in people.", "e": "Resistance moves between people, animals and the environment, which is why stewardship is a One Health effort.", "src": "CDC, One Health and Antimicrobial Resistance"}, {"l": 2, "f": 1, "s": "Fluoroquinolones carry FDA boxed warnings for serious side effects such as tendon rupture.", "e": "FDA warnings also cover peripheral neuropathy and central nervous system effects, so fluoroquinolones should be reserved for when they're needed.", "src": "FDA Drug Safety Communications, 2016 and 2018"}, {"l": 2, "f": 1, "s": "A mild rash from amoxicillin during mononucleosis (EBV) is usually not a true penicillin allergy.", "e": "These rashes are often a drug-virus interaction, not an IgE-mediated allergy.", "src": "CDC, Is It Really a Penicillin Allergy?"}];
  var TESTS=[{"l": 1, "a": 0, "t": "Urine culture", "p": "82-year-old with new confusion. No fever, no urinary symptoms, stable vital signs.", "e": "Look for other causes of delirium and observe, rather than testing and treating bacteriuria.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 1, "a": 1, "t": "Urine culture", "p": "Pregnant patient at an early prenatal visit, no symptoms.", "e": "Screening and treating asymptomatic bacteriuria in pregnancy reduces pyelonephritis.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 1, "a": 0, "t": "Urine culture", "p": "Long-term urinary catheter. Urine looks cloudy and smells, but no fever or other symptoms.", "e": "Bacteriuria is nearly universal with long-term catheters, and cloudy or smelly urine alone isn't infection.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 2, "a": 1, "t": "Urine culture", "p": "Before a planned transurethral resection of the prostate (TURP).", "e": "Screen and treat before urologic procedures that cause mucosal bleeding, since that is where treatment prevents harm.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 2, "a": 0, "t": "Urine culture", "p": "Before an elective hip replacement. No urinary symptoms.", "e": "Screening and treating bacteriuria before non-urologic surgery, including joint replacement, isn't recommended.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 2, "a": 0, "t": "Urine culture", "p": "Kidney transplant 2 years ago. Routine visit, no symptoms.", "e": "Don't screen for or treat bacteriuria in kidney transplant recipients more than 1 month after surgery.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 1, "a": 0, "t": "Urine culture", "p": "Patient with diabetes at a routine visit. No urinary symptoms.", "e": "Don't screen for or treat bacteriuria in people with diabetes.", "src": "IDSA Asymptomatic Bacteriuria Guideline, 2019"}, {"l": 1, "a": 1, "t": "C. difficile test", "p": "New diarrhea: 4 watery stools in 24 hours. No laxatives in the last 48 hours.", "e": "New, unexplained diarrhea (3 or more unformed stools in 24 hours) without recent laxatives is the right group to test.", "src": "IDSA/SHEA C. difficile Guideline, 2017"}, {"l": 1, "a": 0, "t": "C. difficile test", "p": "Loose stools after a stool softener and lactulose this morning.", "e": "Stop the laxatives and wait at least 48 hours. Testing now mostly finds colonization.", "src": "IDSA/SHEA C. difficile Guideline, 2017"}, {"l": 1, "a": 0, "t": "C. difficile test", "p": "Finished C. difficile treatment; stools are formed. The team wants a test of cure.", "e": "Don't test for cure. Tests can stay positive for 6 weeks or longer after successful treatment.", "src": "CDC, Clinical Guidance for C. diff Prevention"}, {"l": 2, "a": 0, "t": "C. difficile test", "p": "Negative C. difficile PCR 3 days ago. Same episode of diarrhea continues.", "e": "Don't repeat testing within 7 days during the same episode of diarrhea.", "src": "IDSA/SHEA C. difficile Guideline, 2017"}, {"l": 1, "a": 1, "t": "MRSA nasal PCR", "p": "Pneumonia on empiric vancomycin.", "e": "A negative result (with no MRSA in cultures) makes MRSA pneumonia unlikely and supports stopping vancomycin.", "src": "Parente et al., Clin Infect Dis 2018"}, {"l": 1, "a": 1, "t": "Blood cultures", "p": "Suspected sepsis. Antibiotics haven't started yet.", "e": "Draw blood cultures before the first dose whenever it won't delay treatment, so therapy can be targeted later.", "src": "Surviving Sepsis Campaign Guidelines, 2021"}, {"l": 2, "a": 0, "t": "Blood cultures", "p": "Mild cellulitis of the leg in a healthy adult with normal vital signs.", "e": "Bacteremia is found in under 10% of these patients, so blood cultures aren't routinely needed.", "src": "Fabre et al., Clin Infect Dis 2020"}, {"l": 2, "a": 0, "t": "Blood cultures", "p": "Fever the day after surgery. Otherwise well.", "e": "Fever in the first 48 hours after surgery has a very low (under 5%) chance of bacteremia.", "src": "Fabre et al., Clin Infect Dis 2020"}, {"l": 1, "a": 1, "t": "Repeat blood cultures", "p": "S. aureus bacteremia, day 2 of therapy.", "e": "Follow-up cultures confirm clearance. Persistent S. aureus bacteremia changes the workup and duration.", "src": "Fabre et al., Clin Infect Dis 2020"}, {"l": 2, "a": 1, "t": "Sputum culture", "p": "Severe community-acquired pneumonia, admitted to the ICU.", "e": "Sputum cultures are recommended in severe CAP and when empirically covering MRSA or Pseudomonas.", "src": "ATS/IDSA CAP Guideline, 2019"}, {"l": 2, "a": 0, "t": "Procalcitonin", "p": "To decide whether to start antibiotics for new pneumonia with a clear infiltrate.", "e": "Start empiric antibiotics for clinically suspected, imaging-confirmed CAP regardless of the procalcitonin level.", "src": "ATS/IDSA CAP Guideline, 2019"}, {"l": 2, "a": 0, "t": "Wound swab", "p": "Diabetic foot ulcer with no signs of infection.", "e": "Don't culture or treat clinically uninfected ulcers. When infection is present, tissue samples beat swabs.", "src": "IWGDF/IDSA Diabetes-Related Foot Infection Guideline, 2023"}, {"l": 1, "a": 1, "t": "Blood cultures", "p": "Fever in a patient with neutropenia after chemotherapy.", "e": "Febrile neutropenia needs blood cultures before empiric antibiotics.", "src": "IDSA Febrile Neutropenia Guideline, 2010"}, {"l": 2, "a": 1, "t": "Legionella urine antigen", "p": "Severe community-acquired pneumonia.", "e": "Legionella testing is suggested for severe CAP (or a known outbreak or recent travel), not routinely for non-severe CAP.", "src": "ATS/IDSA CAP Guideline, 2019"}];

  /* ---------- SORTING GAMES: Myth or Fact, Test or Rest ----------
     A card moves toward the edge; sort it before it gets there. Wrong or missed cards pause on the explanation. */
  function sortGame(G){
    var cards,i,score,lives,streak,right,t0,T,raf,running=false,paused=false,cur,sc,W,Hh,timer,down=null;
    root.innerHTML='<div class="card">'+BACK+'<h2>'+G.title+'</h2>'+
      '<div class="meta"><span>Score: <b class="ss">0</b> <span class="sm"></span></span><span class="sn"></span><span>Lives: <b class="sl">3</b></span></div>'+
      '<div class="bw sg '+G.mode+'"><div class="lane"></div><div class="sc"></div><div class="bins">'+
      '<button class="bin" data-s="0">'+G.labels[0]+'<kbd>'+G.hint[0]+'</kbd></button><button class="bin" data-s="1">'+G.labels[1]+'<kbd>'+G.hint[1]+'</kbd></button></div></div>'+
      '<div class="fb"></div></div>';
    wireBack();sc=$('.sc');
    function mult(){return streak>=6?2:streak>=3?1.5:1}
    function hud(){$('.ss').textContent=score.toLocaleString();$('.sl').textContent=Math.max(0,lives);$('.sn').textContent='Card '+Math.min(i+1,cards.length)+' of '+cards.length;$('.sm').textContent=mult()>1?'· streak ×'+mult():''}
    function start(){cards=pick(G.bank,G.n);i=0;score=0;lives=3;streak=0;right=0;overlay(null);$('.fb').innerHTML='';next()}
    function next(){
      clearTimeout(timer);
      if(i>=cards.length||lives<=0)return end();
      cur=cards[i];paused=false;hud();
      sc.className='sc';sc.style.opacity='';sc.innerHTML=G.render(cur);
      var bw=$('.bw');W=bw.clientWidth;Hh=bw.clientHeight;
      T=G.T*(HARD?.72:1)*Math.max(.65,1-i*.035);t0=performance.now();running=true;place(0);raf=requestAnimationFrame(loop);
    }
    function place(p){
      var x,y;
      if(G.mode==='fall'){x=(W-sc.offsetWidth)/2;y=8+p*(Hh-$('.bins').offsetHeight-sc.offsetHeight-16)}
      else{x=(W-sc.offsetWidth-8)-p*(W-sc.offsetWidth-20);y=110+(170-sc.offsetHeight)/2}
      sc.style.transform='translate('+x+'px,'+y+'px)';
    }
    function loop(t){
      if(!running)return;var p=(t-t0)/1000/T;
      if(p>=1){place(1);return miss('Time ran out.')}
      place(p);raf=requestAnimationFrame(loop);
    }
    function answer(side){
      if(!running||paused)return;running=false;cancelAnimationFrame(raf);
      if(side!==G.ans(cur))return miss('Not quite.');
      var p=Math.min(1,(performance.now()-t0)/1000/T);streak++;right++;
      var pts=Math.round((100+50*(1-p))*mult());score+=pts;
      sc.classList.add('ok');
      sc.style.transform+=G.mode==='fall'?' translate('+(side?W*.3:-W*.3)+'px,60px) scale(.6)':' translate(0,'+(side?-120:120)+'px) scale(.6)';
      $('.fb').innerHTML='<div class="exp"><b class="ok">Correct: '+G.labels[side]+'. +'+pts+'</b> '+esc(cur.e)+'<span class="src">Source: '+esc(cur.src)+'</span></div>';

    function renderClues(){
      var c=cases[state.caseIndex],opened=state.clues.length;
      screen.innerHTML=header(1)+'<h2>Step 1: Review the allergy history</h2><p class="sub">Select each question to reveal the patient\'s response. Review all of them to continue.</p>'+
        '<div class="clue-grid">'+c.clues.map(function(cl,i){var seen=state.clues.indexOf(i)!==-1;
          return '<button class="clue '+(seen?'revealed':'')+'" data-clue="'+i+'" '+(seen?'disabled':'')+'><span class="symbol">'+(seen?'✓':'+')+'</span><span class="clue-text"><strong>'+esc(cl[0])+'</strong><small>'+(seen?esc(cl[1]):'Select to reveal the response')+'</small></span></button>'}).join('')+'</div>'+
        '<p class="muted" style="margin-top:10px">'+opened+' of '+c.clues.length+' responses reviewed</p>'+
        '<div class="actions"><button class="btn" id="ad-risk" '+(opened<c.clues.length?'disabled':'')+'>Assess the reaction</button><button class="btn secondary" id="ad-back">Back</button></div>';
      Array.prototype.forEach.call(screen.querySelectorAll('[data-clue]'),function(b){b.onclick=function(){var i=+b.getAttribute('data-clue');if(state.clues.indexOf(i)<0){state.clues.push(i);state.score+=2}renderClues()}});
      screen.querySelector('#ad-risk').onclick=function(){renderQuestion('risk')};screen.querySelector('#ad-back').onclick=renderBrief;
    }
    function renderQuestion(key){
      var c=cases[state.caseIndex],q=c[key],step=key==='risk'?2:key==='pathway'?3:4,answer=state.answers[key];
      var penfast='<div class="case-intro"><h3 style="margin-bottom:8px">Modified PEN-FAST Clinical Decision Rule</h3>'+
        '<p class="muted">Use the criteria below to calculate the score. The first question identifies who is reporting the history and does not add points.</p><div class="choices">'+
        '<div><strong>1. Who is reporting the penicillin allergy?</strong><p class="muted">Patient, family, or other caregiver (no points)</p></div>'+
        '<div><strong>2. Was the allergy ever reported as one of the following?</strong><ul class="muted"><li>Rash, hives, itching: 0 points</li><li>Serum sickness / drug-induced fever: +4</li><li>DRESS / AGEP: +4</li><li>Interstitial nephritis / drug-induced liver injury: +4</li><li>SJS / TEN: +4</li><li>Unknown or none of the above: 0 points</li></ul></div>'+
        '<div class="row"><strong>3. Reaction within the past 5 years?</strong><span class="pill">Yes +2 • No 0 • Unknown +1</span></div>'+
        '<div class="row"><strong>4. Anaphylaxis or angioedema?</strong><span class="pill">Yes +3 • No 0 • Unknown +1</span></div>'+
        '<div class="row"><strong>5. Did the reaction require treatment or hospitalization?</strong><span class="pill">Yes +1 • No 0 • Unknown (no points specified)</span></div></div>'+
        '<p class="muted" style="margin:10px 0 0">Add the applicable points. Severe delayed or organ-specific reactions are an important exception: do not use a calculated score to send these patients through routine challenge algorithms.</p></div>';
      var opts=key==='risk'?Array.apply(null,{length:11}).map(function(_,n){return 'Modified PEN-FAST score: '+n}):q.opts;
      screen.innerHTML=header(step)+(key==='risk'?'<span class="eyebrow">STEP 2: RISK ASSESSMENT</span>'+penfast:'<span class="eyebrow">'+(key==='pathway'?'STEP 3: EVALUATION PATHWAY':'STEP 4: ANTIBIOTIC DECISION')+'</span>')+
        '<h2>'+esc(q.q)+'</h2><div class="choices">'+opts.map(function(o,i){var cls='';if(answer!==undefined){if(i===q.correct)cls='correct';else if(i===answer)cls='incorrect'}
          return '<button class="answer '+cls+'" data-answer="'+i+'" '+(answer!==undefined?'disabled':'')+'>'+esc(String(o))+'</button>'}).join('')+'</div>'+
        (answer!==undefined?
          '<div class="feedback '+(answer===q.correct?'good':'warn')+'"><strong>'+(answer===q.correct?'Correct':'Incorrect. Review the rationale.')+'</strong>'+esc(q.why)+'</div>'+
          '<div class="actions"><button class="btn" id="ad-next">'+(key==='risk'?'Choose an evaluation pathway':key==='pathway'?'Make the antibiotic decision':'Complete this case')+'</button><button class="btn secondary" id="ad-back">Back to history</button></div>':
          '<p class="muted" style="margin-top:12px">'+(key==='risk'?'Use the criteria above to calculate the total, then select the score. You can go back to review the history.':'Select the best answer. Feedback appears before you continue.')+'</p>'+
          '<div class="actions"><button class="btn secondary" id="ad-back">Back to history</button></div>');
      if(answer===undefined){Array.prototype.forEach.call(screen.querySelectorAll('[data-answer]'),function(b){b.onclick=function(){var n=+b.getAttribute('data-answer');state.answers[key]=n;if(n===q.correct)state.score+=10;renderQuestion(key)}})}
      else screen.querySelector('#ad-next').onclick=function(){if(key==='risk')renderQuestion('pathway');else if(key==='pathway')renderQuestion('drug');else completeCase()};
      screen.querySelector('#ad-back').onclick=renderClues;
    }
    function completeCase(){
      var c=cases[state.caseIndex],correct=['risk','pathway','drug'].filter(function(k){return state.answers[k]===c[k].correct}).length;
      state.caseScores[state.caseIndex]=correct;
      screen.innerHTML=header(4)+'<div class="case-intro"><span class="eyebrow">CASE COMPLETE</span><h2>'+esc(c.title)+'</h2><p>'+esc(c.takeaway)+'</p></div>'+
        '<div class="stats"><div class="stat"><strong>'+correct+'/3</strong><span>Decisions correct</span></div><div class="stat"><strong>+'+(state.clues.length*2+correct*10)+'</strong><span>Case points</span></div><div class="stat"><strong>'+state.score+'</strong><span>Total score</span></div></div>'+
        '<div class="actions"><button class="btn" id="ad-nextcase">'+(state.caseIndex===3?'View final results':'Next case')+'</button><button class="btn secondary" id="ad-board">Case list</button></div>';
      screen.querySelector('#ad-nextcase').onclick=function(){if(state.caseIndex===3)renderFinal();else{state.caseIndex++;beginCase()}};
      screen.querySelector('#ad-board').onclick=renderHome;
    }
    function renderFinal(){
      var total=state.caseScores.reduce(function(a,b){return a+b},0);
      screen.innerHTML='<div class="hero"><div class="eyebrow" style="color:#bfe3ee">ALL CASES COMPLETE</div><h1>Allergy Detective: results</h1><p>You have completed all four patient cases.</p></div>'+
        '<div class="score">'+state.score+' points</div><p class="sub">Clinical decisions correct: '+total+' of 12</p>'+
        award('allergy',true,'Complete all four cases',state.score)+
        '<div class="case-list">'+cases.map(function(c,i){var n=state.caseScores[i]||0;return '<div class="case-tile '+(n===3?'done':'')+'"><strong>'+esc(c.title)+'</strong><span>'+n+' of 3 decisions correct</span></div>'}).join('')+'</div>'+
        '<div class="case-intro"><span class="eyebrow">KEY TAKEAWAYS</span><h2>Putting penicillin allergy assessment into practice</h2>'+
        '<p><strong>1. Use PEN-FAST to help assess risk.</strong><br>The modified PEN-FAST clinical decision rule can help risk-stratify patients with reported penicillin allergies and identify patients who may be appropriate for further evaluation. However, clinical history remains essential. Standard risk-stratification and challenge algorithms do not apply to patients with severe delayed immunologic or organ-specific reactions, such as SCARs, hemolytic anemia, drug-induced liver injury, or acute interstitial nephritis.</p>'+
        '<p><strong>2. Penicillin and cephalosporin cross-reactivity is not a class-wide phenomenon.</strong><br>Cross-reactivity is primarily related to similarities in beta-lactam side chains, particularly the R1 side chain, rather than simply the shared beta-lactam ring. Cefazolin has a unique R1 side chain and can generally be used in many patients with a history of penicillin allergy, including those with prior penicillin anaphylaxis, when there is no history of a severe delayed reaction and the clinical context supports its use.</p>'+
        '<p style="margin-bottom:0"><strong>3. Accurate allergy assessment supports antimicrobial stewardship.</strong><br>Clarifying and appropriately evaluating allergy labels can preserve access to preferred first-line antibiotics, reduce unnecessary use of alternative agents, and support more targeted antimicrobial therapy.</p></div>'+
        '<div class="case-intro refs"><span class="eyebrow">REFERENCES</span>'+
        '<p>1. Khan DA, Banerji A, Blumenthal KG, et al. Drug allergy: A 2022 practice parameter update. <em>J Allergy Clin Immunol</em>. 2022;150(6):1333-1393. doi:10.1016/j.jaci.2022.08.028.</p>'+
        '<p>2. Copaescu AM, Vogrin S, James F, et al. Efficacy of a Clinical Decision Rule to Enable Direct Oral Challenge in Patients With Low-Risk Penicillin Allergy: The PALACE Randomized Clinical Trial. <em>JAMA Intern Med</em>. 2023;183(9):944-952. doi:10.1001/jamainternmed.2023.2986.</p>'+
        '<p>3. Hoffmann WJ, Patel S, Lee EJ, et al. Implementation and performance of a nurse administered modified PEN-FAST clinical decision rule in the electronic health record. <em>Antimicrob Steward Healthc Epidemiol</em>. 2025;5(1):e159. doi:10.1017/ash.2025.10066.</p></div>'+
        '<div class="notice"><strong>Clinical reminder:</strong> This educational activity does not replace patient-specific assessment, specialist consultation, or institutional allergy-evaluation protocols.</div>'+
        '<div class="actions"><button class="btn" id="ad-again">Play again</button><button class="btn secondary" id="ad-home">All games</button></div>';
      screen.querySelector('#ad-again').onclick=start;screen.querySelector('#ad-home').onclick=menu;
    }
    start();
  }

  menu();
})();
//]]></script>
</div>

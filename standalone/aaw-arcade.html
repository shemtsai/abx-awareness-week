<script>//<![CDATA[
(function(){
  var root=document.getElementById('aaw-hub'),cleanup=null;
  /* Internal game IDs. Not shown in the games; the website uses them for its leaderboard. */
  var CODES={wheel:'NARROW',blast:'TARGETED',run:'COVERAGE',whack:'TIMEOUT',catch:'SHIELD',clock:'SHORTER',allergy:'PENICILLIN',myth:'DELABEL',match:'PATHOGEN',dash:'DEESCALATE',dur:'DURATION',scr:'STEWARD'};
  /* Reports game activity (start/finish). Does nothing in the standalone file; the Vercel site listens for it to track plays and fill in codes. */

  var MYTHS=[{"l": 1, "f": 0, "s": "Antibiotics work against colds and the flu.", "e": "Colds and flu are caused by viruses, and antibiotics don't work against viruses. They won't help, and they can still cause side effects.", "src": "CDC, Be Antibiotics Aware"}, {"l": 1, "f": 0, "s": "Green or yellow mucus means you need an antibiotic.", "e": "Mucus color changes during many viral illnesses. Color alone doesn't mean a bacterial infection.", "src": "CDC, Be Antibiotics Aware"}, {"l": 1, "f": 1, "s": "About 1 in 5 hospitalized patients who receive antibiotics has an antibiotic-related adverse event.", "e": "In a study of nearly 1,500 hospitalized adults, 20% had at least one antibiotic-associated adverse event, and about 1 in 5 antibiotic courses wasn't clinically needed.", "src": "Tamma et al., JAMA Intern Med 2017"}, {"l": 2, "f": 1, "s": "Each additional 10 days of antibiotic therapy raises the risk of an adverse event by about 3%.", "e": "Risk climbs with every extra day of therapy, which is one reason shorter effective courses matter.", "src": "Tamma et al., JAMA Intern Med 2017"}, {"l": 1, "f": 0, "s": "Most people with a penicillin allergy on their chart are truly allergic.", "e": "About 10% of patients report a penicillin allergy, but fewer than 1% of the whole population is truly allergic.", "src": "CDC, Is It Really a Penicillin Allergy?"}, {"l": 2, "f": 1, "s": "About 80% of people with a true IgE-mediated penicillin allergy lose it within 10 years.", "e": "Penicillin allergy wanes over time, so old labels are worth re-evaluating.", "src": "CDC, Is It Really a Penicillin Allergy?"}, {"l": 2, "f": 1, "s": "A penicillin allergy label is linked to a higher risk of MRSA and C. difficile.", "e": "Patients with the label had a 69% higher risk of MRSA and a 26% higher risk of C. difficile, driven largely by the alternative antibiotics they received.", "src": "Blumenthal et al., BMJ 2018"}, {"l": 1, "f": 0, "s": "Antibiotic resistance means a person's body has become resistant to antibiotics.", "e": "Bacteria and fungi become resistant, not the body. Resistant germs can then spread to other people.", "src": "CDC, About Antimicrobial Resistance"}, {"l": 1, "f": 1, "s": "Drug-resistant bacteria and fungi cause millions of infections in the United States each year.", "e": "CDC's 2026 report estimates about 9.7 million drug-resistant infections and more than 50,000 deaths each year (2023 data).", "src": "CDC Antimicrobial Resistance Threats Report, 2026"}, {"l": 2, "f": 0, "s": "A family history of penicillin allergy means a person should avoid penicillin.", "e": "A relative's allergy doesn't raise a patient's own risk. No avoidance or testing is needed for family history alone.", "src": "Drug Allergy Practice Parameter, J Allergy Clin Immunol 2022"}, {"l": 2, "f": 0, "s": "Penicillin skin testing is the only way to remove a penicillin allergy label.", "e": "For low-risk histories, a direct oral amoxicillin challenge was noninferior to skin testing followed by challenge.", "src": "Copaescu et al., JAMA Intern Med 2023 (PALACE trial)"}, {"l": 2, "f": 0, "s": "A patient with a penicillin allergy label can't receive cefazolin.", "e": "Cefazolin has a unique side chain with negligible cross-reactivity with penicillins. It can be given without testing, even after penicillin anaphylaxis. The exception is a severe delayed reaction such as SJS/TEN or DRESS, which needs specialist evaluation.", "src": "Drug Allergy Practice Parameter, J Allergy Clin Immunol 2022"}, {"l": 1, "f": 1, "s": "Alcohol-based hand sanitizer doesn't reliably remove C. difficile spores.", "e": "Alcohol doesn't remove or inactivate the spores in lab studies. CDC still prefers hand sanitizer for routine care and recommends soap and water during C. difficile outbreaks, with gloves and gowns for contact precautions.", "src": "CDC, Hand Hygiene in Healthcare Settings"}, {"l": 1, "f": 1, "s": "Most acute bronchitis in otherwise healthy adults is caused by viruses.", "e": "Antibiotics don't meaningfully shorten acute bronchitis, and they do cause side effects.", "src": "ACP/CDC High-Value Care Advice, 2016"}, {"l": 1, "f": 0, "s": "Antibiotics only affect the bacteria causing the infection.", "e": "Antibiotics also kill helpful bacteria, which can lead to C. difficile infection and resistance.", "src": "CDC, Be Antibiotics Aware"}, {"l": 1, "f": 1, "s": "Reassessing antibiotics at 48 to 72 hours (a time-out) is a core stewardship practice.", "e": "With cultures and the clinical course in hand, ask: still needed? Right drug? Narrow? Switch to oral? Stop date?", "src": "CDC Core Elements of Hospital Antibiotic Stewardship"}, {"l": 2, "f": 1, "s": "Drug-resistant fungi, such as Candida auris, are among CDC's urgent resistance threats.", "e": "Resistance isn't only a bacterial problem. C. auris can resist all major antifungal classes and spreads in healthcare facilities.", "src": "CDC Antimicrobial Resistance Threats Report"}, {"l": 1, "f": 1, "s": "Antibiotic use in animals and agriculture can contribute to resistance in people.", "e": "Resistance moves between people, animals and the environment, which is why stewardship is a One Health effort.", "src": "CDC, One Health and Antimicrobial Resistance"}, {"l": 2, "f": 1, "s": "Fluoroquinolones carry FDA boxed warnings for serious side effects such as tendon rupture.", "e": "FDA warnings also cover peripheral neuropathy and central nervous system effects, so fluoroquinolones should be reserved for when they're needed.", "src": "FDA Drug Safety Communications, 2016 and 2018"}, {"l": 2, "f": 1, "s": "A mild rash from amoxicillin during mononucleosis (EBV) is usually not a true penicillin allergy.", "e": "These rashes are often a drug-virus interaction, not an IgE-mediated allergy.", "src": "CDC, Is It Really a Penicillin Allergy?"}, {"l": 1, "f": 1, "s": "People are 7 to 10 times more likely to get C. diff while taking antibiotics and in the month after.", "e": "Antibiotics disrupt the gut bacteria that normally keep C. difficile in check, which is why every unneeded course carries risk.", "src": "CDC, C. diff Fact Sheet"}, {"l": 1, "f": 1, "s": "About 3 in 10 antibiotics prescribed in U.S. doctor's offices and emergency departments aren't needed.", "e": "CDC studies estimated about 30% of these prescriptions were unnecessary in 2010–2011, and about 28% in 2014–2015, mostly for respiratory conditions such as colds and bronchitis.", "src": "Fleming-Dutra et al., JAMA 2016; Hersh et al., Clin Infect Dis 2020"}, {"l": 1, "f": 0, "s": "Most sinus infections need antibiotics.", "e": "Most sinus infections are viral, and even many bacterial ones get better on their own. Antibiotics are reserved for specific patterns, such as severe or worsening symptoms.", "src": "CDC, Be Antibiotics Aware; IDSA Rhinosinusitis Guideline, 2012"}, {"l": 1, "f": 1, "s": "Most sore throats are caused by viruses.", "e": "Group A strep causes only about 5–15% of sore throats in adults and 20–30% in children. Testing tells you who needs an antibiotic.", "src": "IDSA Group A Strep Pharyngitis Guideline, 2012"}, {"l": 2, "f": 0, "s": "About 10% of people with a penicillin allergy will also react to a cephalosporin.", "e": "True cross-reactivity is less than 2%, and lower still for cephalosporins with side chains that differ from the penicillin involved.", "src": "Drug Allergy Practice Parameter, J Allergy Clin Immunol 2022"}, {"l": 1, "f": 1, "s": "Vaccines help fight antibiotic resistance.", "e": "Vaccines prevent infections such as flu and pneumococcal disease, which means fewer antibiotic courses and fewer chances for resistance to develop.", "src": "WHO, Vaccines and Antimicrobial Resistance"}, {"l": 1, "f": 0, "s": "IV antibiotics always work better than oral antibiotics.", "e": "Many oral antibiotics, such as levofloxacin, linezolid, TMP-SMX, metronidazole and doxycycline, reach blood levels similar to IV. Switching when the patient is stable and eating is a core stewardship practice.", "src": "CDC Core Elements of Hospital Antibiotic Stewardship"}, {"l": 1, "f": 1, "s": "Shorter antibiotic courses work as well as longer ones for many common infections.", "e": "Randomized trials support shorter courses for community-acquired pneumonia, intra-abdominal infection after source control and uncomplicated Gram-negative bacteremia.", "src": "Dinh et al., Lancet 2021; Sawyer et al., N Engl J Med 2015; BALANCE trial, N Engl J Med 2025"}, {"l": 2, "f": 0, "s": "Every case of uncomplicated diverticulitis needs antibiotics.", "e": "ACP suggests initially managing select patients with acute uncomplicated left-sided diverticulitis without antibiotics.", "src": "ACP Diverticulitis Guideline, 2022"}, {"l": 2, "f": 0, "s": "People with a hip or knee replacement need antibiotics before every dental visit.", "e": "The ADA found no link between dental procedures and prosthetic joint infection. In general, prophylactic antibiotics aren't recommended for these patients.", "src": "ADA Clinical Practice Guideline, 2015"}, {"l": 2, "f": 1, "s": "U.S. infections from NDM-producing carbapenem-resistant Enterobacterales rose by more than 460% from 2019 to 2023.", "e": "NDM enzymes make bacteria resistant to nearly all antibiotics, and many labs can't detect them quickly.", "src": "CDC; Rankin et al., Ann Intern Med 2025"}, {"l": 1, "f": 1, "s": "Bacteria can pass resistance genes to other bacteria.", "e": "Resistance genes can travel on mobile pieces of DNA, such as plasmids, and spread between different species of bacteria.", "src": "CDC, How Antimicrobial Resistance Happens"}, {"l": 1, "f": 1, "s": "U.S. Antibiotic Awareness Week is held every November.", "e": "It runs November 18 to 24 each year, alongside WHO's World AMR Awareness Week.", "src": "CDC, U.S. Antibiotic Awareness Week"}, {"l": 2, "f": 0, "s": "CDC's Core Elements of antibiotic stewardship apply only to hospitals.", "e": "CDC also publishes Core Elements for outpatient settings, nursing homes, and small and critical access hospitals.", "src": "CDC Core Elements of Antibiotic Stewardship"}, {"l": 2, "f": 1, "s": "FDA warns that fluoroquinolones can raise the risk of aortic aneurysm or dissection.", "e": "FDA advises avoiding fluoroquinolones in people with or at risk for an aortic aneurysm unless no other options are available.", "src": "FDA Drug Safety Communication, 2018"}, {"l": 1, "f": 0, "s": "Antibiotics treat COVID-19.", "e": "COVID-19 is caused by a virus. Antibiotics don't work against it unless there's a separate bacterial infection.", "src": "CDC, Be Antibiotics Aware"}, {"l": 2, "f": 1, "s": "About 1 in 6 people who get C. diff get it again within 2 to 8 weeks.", "e": "Recurrence is common, which is one reason preventing the first episode matters so much.", "src": "CDC, C. diff Fact Sheet"}, {"l": 1, "f": 1, "s": "Clean hands are one of the most important ways to stop the spread of resistant germs.", "e": "Hand hygiene before and after patient contact prevents infections, and every prevented infection is one that doesn't need antibiotics.", "src": "CDC, Clean Hands Count"}];

  /* ---------- SORTING GAMES: Myth or Fact, Test or Rest ----------
     A card moves toward the edge; sort it before it gets there. Wrong or missed cards pause on the explanation. */
  function sortGame(G){
    var cards,i,score,lives,streak,right,t0,T,raf,running=false,paused=false,cur,sc,W,Hh,timer,down=null;
    root.innerHTML='<div class="card">'+BACK+'<h2>'+G.title+'</h2>'+
      '<div class="meta"><span>Score: <b class="ss">0</b> <span class="sm"></span></span><span class="sn"></span><span>Lives: <b class="sl">3</b></span></div>'+
      '<div class="bw sg '+G.mode+'"><div class="lane"></div><div class="sc"></div><div class="bins">'+
      '<button class="bin" data-s="0">'+G.labels[0]+'<kbd>'+G.hint[0]+'</kbd></button><button class="bin" data-s="1">'+G.labels[1]+'<kbd>'+G.hint[1]+'</kbd></button></div></div>'+
      '<div class="fb"></div></div>';
    wireBack();sc=$('.sc');
    function mult(){return streak>=6?2:streak>=3?1.5:1}
    function hud(){$('.ss').textContent=score.toLocaleString();$('.sl').textContent=Math.max(0,lives);$('.sn').textContent='Card '+Math.min(i+1,cards.length)+' of '+cards.length;$('.sm').textContent=mult()>1?'· streak ×'+mult():''}
    function start(){live(function(){return score});cards=pick(G.bank,G.n);i=0;score=0;lives=3;streak=0;right=0;overlay(null);$('.fb').innerHTML='';next()}
    function next(){
      clearTimeout(timer);
      if(i>=cards.length||lives<=0)return end();
      cur=cards[i];paused=false;hud();
      sc.className='sc';sc.style.opacity='';sc.innerHTML=G.render(cur);
      var bw=$('.bw');W=bw.clientWidth;Hh=bw.clientHeight;
      T=G.T*(HARD?.72:1)*Math.max(.65,1-i*.035);t0=performance.now();running=true;place(0);raf=requestAnimationFrame(loop);
    }
    function place(p){
      var x,y;
      if(G.mode==='fall'){x=(W-sc.offsetWidth)/2;y=8+p*(Hh-$('.bins').offsetHeight-sc.offsetHeight-16)}
      else{x=(W-sc.offsetWidth-8)-p*(W-sc.offsetWidth-20);y=110+(170-sc.offsetHeight)/2}
      sc.style.transform='translate('+x+'px,'+y+'px)';
    }
    function loop(t){
      if(!running)return;var p=(t-t0)/1000/T;
      if(p>=1){place(1);return miss('Time ran out.')}
      place(p);raf=requestAnimationFrame(loop);
    }
    function answer(side){
      if(!running||paused)return;running=false;cancelAnimationFrame(raf);
      if(side!==G.ans(cur))return miss('Not quite.');
      var p=Math.min(1,(performance.now()-t0)/1000/T);streak++;right++;
      var pts=Math.round((100+50*(1-p))*mult());score+=pts;
      sc.classList.add('ok');
      sc.style.transform+=G.mode==='fall'?' translate('+(side?W*.3:-W*.3)+'px,60px) scale(.6)':' translate(0,'+(side?-120:120)+'px) scale(.6)';
      $('.fb').innerHTML='<div class="exp"><b class="ok">Correct: '+G.labels[side]+'. +'+pts+'</b> '+esc(cur.e)+'<span class="src">Source: '+esc(cur.src)+'</span></div>';
      i++;hud();timer=setTimeout(next,550);
    }
    function miss(why){
      running=false;cancelAnimationFrame(raf);lives--;streak=0;paused=true;sc.classList.add('bad');
      var c=cur;i++;hud();
      $('.fb').innerHTML='<div class="exp"><b class="bad">'+why+'</b> The answer is <b>'+G.labels[G.ans(c)]+'</b>. '+esc(c.e)+'<span class="src">Source: '+esc(c.src)+'</span></div>'+
        '<button class="btn nx">'+(lives>0&&i<cards.length?'Continue':'See results')+'</button>';
      var nx=$('.nx');nx.focus({preventScroll:true});nx.onclick=function(){$('.fb').innerHTML='';next()};
    }
    function end(){
      running=false;cancelAnimationFrame(raf);sc.innerHTML='';sc.className='sc';sc.style.opacity='0';
      overlay('<h2>'+(lives>0?'Round complete':'Out of lives')+'</h2><div class="big">'+score.toLocaleString()+'</div>'+
        '<p class="sub">'+right+' of '+cards.length+' correct. Answer quickly and build streaks for more points.</p>'+
        award(G.id,right>=G.need,'Get '+G.need+' or more correct',score)+AGAIN,start);
      if(right===cards.length)confetti();
    }
    $$('.bin').forEach(function(b){b.onclick=function(){answer(+b.dataset.s)}});
    sc.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY}});
    sc.addEventListener('pointerup',function(e){
      if(!down)return;var dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;
      if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
      answer(G.mode==='belt'&&Math.abs(dy)>Math.abs(dx)?(dy<0?1:0):(dx>0?1:0));
    });
    function kd(e){
      if(!running)return;
      if(G.keys[0].indexOf(e.key)>=0){e.preventDefault();answer(0)}
      else if(G.keys[1].indexOf(e.key)>=0){e.preventDefault();answer(1)}
    }

      var c=cases[state.caseIndex],q=c.risk,sel=state.pf,answer=state.answers.risk,done=answer!==undefined,total=pfTotal(sel);
      function seg(k,label,opts){
        return '<div class="pf-item"><strong>'+label+'</strong><div class="seg" data-k="'+k+'">'+opts.map(function(o){
          var on=sel[k]===o[0],cls=(on?'on ':'')+(done?(c.pf[k]===o[0]?'exp':(on?'wrong':'')):''),p=pfPts(k,o[0]);
          return '<button type="button" class="'+cls+'" data-v="'+o[0]+'"'+(done?' disabled':'')+'>'+esc(o[1])+'<em>'+(p?'+'+p:'0')+'</em></button>'}).join('')+'</div></div>'}
      var complete=['p','r','a','t'].every(function(k){return sel[k]});
      screen.innerHTML=header(2)+'<span class="eyebrow">STEP 2: RISK ASSESSMENT</span><h2>Build the modified PEN-FAST score</h2>'+
        '<p class="sub">Use your notebook and tap the answer for each item. The score adds up as you go. (The first PEN-FAST item, who reports the allergy, adds no points.)</p>'+notebook()+
        '<div class="pf">'+seg('p','Was the reaction ever reported as one of these?',PF2)+seg('r','Did the reaction happen within the past 5 years?',PFY)+
        seg('a','Was it anaphylaxis or angioedema?',PFY)+seg('t','Did it require treatment or hospitalization?',PFY)+'</div>'+
        '<div class="pf-total"><span>Modified PEN-FAST score</span><b class="'+(total!==lastTotal?'bump':'')+'">'+total+'</b></div>'+
        (done?'<div class="feedback '+(answer===q.correct?'good':'warn')+'"><strong>'+(answer===q.correct?'Correct: the score is '+q.correct+'.':'Not quite. The score is '+q.correct+'; the answers outlined in green match this history.')+'</strong>'+esc(q.why)+'</div>'+
          '<div class="actions"><button class="btn" id="ad-next">Choose an evaluation pathway</button><button class="btn secondary" id="ad-back">Back to the interview</button></div>':
          '<p class="muted" style="margin:10px 0 0">Severe delayed or organ-specific reactions are an important exception: a calculated score never sends these patients through routine challenge algorithms.</p>'+
          '<div class="actions"><button class="btn" id="ad-lock"'+(complete?'':' disabled')+'>Lock in score</button><button class="btn secondary" id="ad-back">Back to the interview</button></div>');
      lastTotal=total;
      if(!done){
        Array.prototype.forEach.call(screen.querySelectorAll('.seg button'),function(b){b.onclick=function(){sel[b.parentNode.getAttribute('data-k')]=b.getAttribute('data-v');renderCalc()}});
        screen.querySelector('#ad-lock').onclick=function(){state.answers.risk=pfTotal(sel);if(state.answers.risk===q.correct){state.score+=10;confetti()}renderCalc()};
      }else screen.querySelector('#ad-next').onclick=function(){renderQuestion('pathway')};
      screen.querySelector('#ad-back').onclick=renderClues;
    }
    function renderQuestion(key){
      var c=cases[state.caseIndex],q=c[key],step=key==='risk'?2:key==='pathway'?3:4,answer=state.answers[key];
      var opts=q.opts;
      screen.innerHTML=header(step)+'<span class="eyebrow">'+(key==='pathway'?'STEP 3: EVALUATION PATHWAY':'STEP 4: ANTIBIOTIC DECISION')+'</span>'+notebook()+
        '<h2>'+esc(q.q)+'</h2><div class="choices">'+opts.map(function(o,i){var cls='';if(answer!==undefined){if(i===q.correct)cls='correct';else if(i===answer)cls='incorrect'}
          return '<button class="answer '+cls+'" data-answer="'+i+'" '+(answer!==undefined?'disabled':'')+'>'+esc(String(o))+'</button>'}).join('')+'</div>'+
        (answer!==undefined?
          '<div class="feedback '+(answer===q.correct?'good':'warn')+'"><strong>'+(answer===q.correct?'Correct':'Incorrect. Review the rationale.')+'</strong>'+esc(q.why)+'</div>'+
          '<div class="actions"><button class="btn" id="ad-next">'+(key==='risk'?'Choose an evaluation pathway':key==='pathway'?'Make the antibiotic decision':'Complete this case')+'</button><button class="btn secondary" id="ad-back">Back to the interview</button></div>':
          '<p class="muted" style="margin-top:12px">'+(key==='risk'?'Use the criteria above to calculate the total, then select the score. You can go back to review the history.':'Select the best answer. Feedback appears before you continue.')+'</p>'+
          '<div class="actions"><button class="btn secondary" id="ad-back">Back to the interview</button></div>');
      if(answer===undefined){Array.prototype.forEach.call(screen.querySelectorAll('[data-answer]'),function(b){b.onclick=function(){var n=+b.getAttribute('data-answer');state.answers[key]=n;if(n===q.correct)state.score+=10;renderQuestion(key);if(n===q.correct)confetti()}})}
      else screen.querySelector('#ad-next').onclick=function(){if(key==='pathway')renderQuestion('drug');else completeCase()};
      screen.querySelector('#ad-back').onclick=renderClues;
    }
    function completeCase(){
      var c=cases[state.caseIndex],correct=['risk','pathway','drug'].filter(function(k){return state.answers[k]===c[k].correct}).length;
      state.caseScores[state.caseIndex]=correct;
      screen.innerHTML=header(4)+'<div class="case-intro" style="text-align:center"><div class="stamp">CASE CLOSED</div><div class="stars" aria-label="'+correct+' of 3 decisions correct">'+'★★★'.slice(0,correct)+'<i>'+'★★★'.slice(correct)+'</i></div><h2>Case '+(state.caseIndex+1)+'</h2><p style="text-align:left">'+esc(c.takeaway)+'</p></div>'+
        '<div class="stats"><div class="stat"><strong>'+correct+'/3</strong><span>Decisions correct</span></div><div class="stat"><strong>+'+(state.clues.length*2+correct*10)+'</strong><span>Case points</span></div><div class="stat"><strong>'+state.score+'</strong><span>Total score</span></div></div>'+
        '<div class="actions"><button class="btn" id="ad-nextcase">'+(state.caseIndex===3?'View final results':'Next case')+'</button><button class="btn secondary" id="ad-board">Case list</button></div>';
      screen.querySelector('#ad-nextcase').onclick=function(){if(state.caseIndex===3)renderFinal();else{state.caseIndex++;beginCase()}};
      screen.querySelector('#ad-board').onclick=renderHome;
    }
    function renderFinal(){
      var total=state.caseScores.reduce(function(a,b){return a+b},0);
      screen.innerHTML='<div class="hero"><div class="eyebrow" style="color:#bfe3ee">ALL CASES COMPLETE</div><h1>Allergy Detective: results</h1><p>You have completed all four patient cases.</p></div>'+
        '<div class="score">'+state.score+' points</div><div class="rank">'+(total===12?'🏅 Chief Detective':total>=9?'🕵️ Senior Detective':total>=6?'🔍 Detective':'📋 Rookie Detective')+'</div><p class="sub">Clinical decisions correct: '+total+' of 12</p>'+
        award('allergy',true,'Complete all four cases',state.score)+
        '<div class="case-list">'+cases.map(function(c,i){var n=state.caseScores[i]||0;return '<div class="case-tile '+(n===3?'done':'')+'"><strong>Case '+(i+1)+': '+esc(c.infection)+'</strong><span>'+'★★★'.slice(0,n)+' '+n+' of 3 decisions correct</span></div>'}).join('')+'</div>'+
        '<div class="case-intro"><span class="eyebrow">KEY TAKEAWAYS</span><h2>Putting penicillin allergy assessment into practice</h2>'+
        '<p><strong>1. Use PEN-FAST to help assess risk.</strong><br>The modified PEN-FAST clinical decision rule can help risk-stratify patients with reported penicillin allergies and identify patients who may be appropriate for further evaluation. However, clinical history remains essential. Standard risk-stratification and challenge algorithms do not apply to patients with severe delayed immunologic or organ-specific reactions, such as SCARs, hemolytic anemia, drug-induced liver injury, or acute interstitial nephritis.</p>'+
        '<p><strong>2. Penicillin and cephalosporin cross-reactivity is not a class-wide phenomenon.</strong><br>Cross-reactivity is primarily related to similarities in beta-lactam side chains, particularly the R1 side chain, rather than simply the shared beta-lactam ring. Cefazolin has a unique R1 side chain and can generally be used in many patients with a history of penicillin allergy, including those with prior penicillin anaphylaxis, when there is no history of a severe delayed reaction and the clinical context supports its use.</p>'+
        '<p style="margin-bottom:0"><strong>3. Accurate allergy assessment supports antimicrobial stewardship.</strong><br>Clarifying and appropriately evaluating allergy labels can preserve access to preferred first-line antibiotics, reduce unnecessary use of alternative agents, and support more targeted antimicrobial therapy.</p></div>'+
        '<div class="case-intro refs"><span class="eyebrow">REFERENCES</span>'+
        '<p>1. Khan DA, Banerji A, Blumenthal KG, et al. Drug allergy: A 2022 practice parameter update. <em>J Allergy Clin Immunol</em>. 2022;150(6):1333-1393. doi:10.1016/j.jaci.2022.08.028.</p>'+
        '<p>2. Copaescu AM, Vogrin S, James F, et al. Efficacy of a Clinical Decision Rule to Enable Direct Oral Challenge in Patients With Low-Risk Penicillin Allergy: The PALACE Randomized Clinical Trial. <em>JAMA Intern Med</em>. 2023;183(9):944-952. doi:10.1001/jamainternmed.2023.2986.</p>'+
        '<p>3. Hoffmann WJ, Patel S, Lee EJ, et al. Implementation and performance of a nurse administered modified PEN-FAST clinical decision rule in the electronic health record. <em>Antimicrob Steward Healthc Epidemiol</em>. 2025;5(1):e159. doi:10.1017/ash.2025.10066.</p></div>'+
        '<div class="notice"><strong>Clinical reminder:</strong> This educational activity does not replace patient-specific assessment, specialist consultation, or institutional allergy-evaluation protocols.</div>'+
        '<div class="actions"><button class="btn" id="ad-again">Play again</button><button class="btn secondary" id="ad-home">All games</button></div>';
      screen.querySelector('#ad-again').onclick=start;screen.querySelector('#ad-home').onclick=menu;
    }
    start();
  }

  menu();
  /* On a new screen (game, instructions, results), bring the top of the arcade back into view if the page is scrolled past it, e.g. after tapping a tile low on a phone */
  if(window.MutationObserver)new MutationObserver(function(){var t=root.getBoundingClientRect().top;if(t<0)window.scrollBy(0,t-12)}).observe(root,{childList:true});
})();

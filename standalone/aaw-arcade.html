<div class="aaw-wrap">
<div id="aaw-hub"></div>
<style>/*<![CDATA[*/
#aaw-hub{--c:#1f6f8b;--ok:#2e7d32;--bad:#c62828;--bg:#f6f9fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;max-width:720px;margin:0 auto;color:#1d2a33;line-height:1.45}
#aaw-hub *{box-sizing:border-box}

#aaw-hub h3{margin:0;font-size:1.05em}
#aaw-hub .sub{margin:0 0 14px;color:#5a6b76;font-size:.92em}
#aaw-hub .center{text-align:center}
#aaw-hub button{font:inherit;cursor:pointer;border-radius:8px;color:inherit}
#aaw-hub .btn{padding:11px 20px;border:0;background:var(--c);color:#fff;font-weight:600;margin-top:14px}
#aaw-hub .btn.ghost{background:transparent;color:var(--c);border:1.5px solid var(--c);margin-left:8px}
#aaw-hub .back{border:0;background:none;color:var(--c);font-weight:600;padding:0;margin-bottom:10px}
#aaw-hub .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#aaw-hub .tile{text-align:left;padding:16px;border:1.5px solid #c5d5de;background:#fff}
#aaw-hub .tile:hover{border-color:var(--c)}
#aaw-hub .tile .ic{font-size:1.8em}
#aaw-hub .tile p{margin:4px 0 0;font-size:.88em;color:#5a6b76}
#aaw-hub .bar{height:6px;background:#dde8ee;border-radius:3px;margin-bottom:12px;overflow:hidden}
#aaw-hub .bar i{display:block;height:100%;background:var(--c);transition:width .3s}
#aaw-hub .meta{display:flex;justify-content:space-between;font-size:.85em;color:#5a6b76;margin-bottom:10px}
#aaw-hub .tag{display:inline-block;font-size:.75em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
#aaw-hub .q{font-size:1.06em;font-weight:600;margin:0 0 14px}
#aaw-hub .opts{display:grid;gap:8px}
#aaw-hub .opt{text-align:left;padding:12px 14px;border:1.5px solid #c5d5de;background:#fff;min-height:44px}
#aaw-hub .opt:hover:not(:disabled){border-color:var(--c)}
#aaw-hub .opt:disabled{cursor:default}
#aaw-hub .opt.sel{border-color:var(--c);background:#e3f1f6}
#aaw-hub .opt.ok{border-color:var(--ok);background:#e8f5e9}
#aaw-hub .opt.bad{border-color:var(--bad);background:#ffebee}
#aaw-hub .exp{margin-top:14px;padding:12px 14px;background:#fff;border-left:4px solid var(--c);border-radius:6px;font-size:.95em}
#aaw-hub b.ok{color:var(--ok)}#aaw-hub b.bad{color:var(--bad)}
#aaw-hub .src{display:block;margin-top:6px;font-size:.82em;color:#6b7c87}
#aaw-hub .big{font-size:2.4em;font-weight:700;color:var(--c);margin:8px 0}
#aaw-hub .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#aaw-hub .scr{font-size:1.8em;font-weight:700;letter-spacing:.25em;color:var(--c);margin:10px 0;word-break:break-all}
#aaw-hub input{font:inherit;padding:11px 12px;border:1.5px solid #c5d5de;border-radius:8px;width:100%;text-transform:uppercase}
@keyframes aaw-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#aaw-hub .shake{animation:aaw-shake .25s 2}
#aaw-hub{position:relative}
#aaw-hub .btn:disabled{opacity:.4;cursor:default}

/* wheel */
#aaw-hub .board{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;padding:14px;background:#123f50;border-radius:10px;margin-bottom:10px}
#aaw-hub .wd{display:flex;gap:4px}
#aaw-hub .lt{width:28px;height:36px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em;color:#123f50}
#aaw-hub .lt.pn{background:transparent;color:#fff;width:auto}
#aaw-hub .whw{position:relative;width:280px;height:280px;margin:6px auto}
#aaw-hub .wc{width:280px;height:280px;display:block}
#aaw-hub .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #c62828;z-index:2}
#aaw-hub .wctl{text-align:center}#aaw-hub .wctl .btn{margin:10px 4px 0}
#aaw-hub .kb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:12px}
#aaw-hub .key{padding:8px 0;border:1.5px solid #c5d5de;background:#fff;font-weight:700}
#aaw-hub .key:disabled{opacity:.35;cursor:default}#aaw-hub .key.used{text-decoration:line-through}
#aaw-hub .slv{display:flex;gap:8px;margin-top:10px}#aaw-hub .slv .btn{margin:0}
@media(max-width:480px){#aaw-hub .lt{width:22px;height:30px;font-size:1em}}
/* blaster */
#aaw-hub .bw{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(#eaf4f8,#fdf3f3);border:1px solid #d7e3ea;touch-action:manipulation}
#aaw-hub .bc{display:block;width:100%;height:380px;cursor:crosshair}
#aaw-hub .wp{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#aaw-hub .wbtn{flex:1 1 110px;padding:10px 6px;border:2px solid var(--w);background:#fff;font-weight:600;font-size:.9em}
#aaw-hub .wbtn.on{background:var(--w);color:#fff}
#aaw-hub .wbtn small{opacity:.6}
/* whack */
#aaw-hub .wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
#aaw-hub .hole{position:relative;height:104px;background:radial-gradient(ellipse at 50% 85%,#0b2a36 0 45%,#1f6f8b 46%);border-radius:10px;overflow:hidden}
#aaw-hub .pop{position:absolute;left:6px;right:6px;top:6px;bottom:6px;background:#fff;border:0;border-radius:8px;padding:6px;font-size:.8em;font-weight:600;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;transform:translateY(110%);transition:transform .15s}
#aaw-hub .pop.up{transform:none}
#aaw-hub .pop.good{background:#e8f5e9;color:var(--ok)}#aaw-hub .pop.oops{background:#ffebee;color:var(--bad)}
#aaw-hub .stop{display:block;width:100%;padding:16px;font-size:1.2em;margin-top:12px}

#aaw-hub .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(246,249,251,.94);text-align:center;padding:20px}
/* instructions screen */
#aaw-hub .intro .ic{font-size:2em;line-height:1}
#aaw-hub .intro h3{margin:14px 0 4px;color:#123f50}
#aaw-hub .intro ol{margin:0;padding-left:22px}#aaw-hub .intro li{margin-bottom:5px}
/* runner coverage reference */
#aaw-hub details.ref{margin-top:12px;background:#fff;border:1px solid #d7e3ea;border-radius:10px}
#aaw-hub details.ref summary{cursor:pointer;padding:10px 14px;font-weight:700;color:#123f50}
#aaw-hub .tw{overflow-x:auto;padding:0 12px 12px}
#aaw-hub table.abg{width:100%;border-collapse:collapse;font-size:.76em;text-align:center}
#aaw-hub table.abg th,#aaw-hub table.abg td{border:1px solid #e2e8f0;padding:5px 4px}
#aaw-hub table.abg th{background:#f6f9fb}
#aaw-hub table.abg td.dn{text-align:left;font-weight:700;white-space:nowrap}
#aaw-hub table.abg td.y{background:#dcfce7;color:#166534;font-weight:800}
#aaw-hub table.abg td.n{color:#b9c4cb}
/* allergy detective */
#aaw-hub .ad h1,#aaw-hub .ad h2,#aaw-hub .ad h3,#aaw-hub .ad p{margin-top:0}
#aaw-hub .ad h1{font-size:1.55em;margin-bottom:5px}
#aaw-hub .ad h2{font-size:1.2em;color:#123f50;margin-bottom:8px}
#aaw-hub .ad h3{font-size:1em;margin-bottom:5px}
#aaw-hub .ad .muted{color:#5a6b76;font-size:.92em}
#aaw-hub .ad .eyebrow{display:block;font-size:.75em;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--c);margin-bottom:4px}
#aaw-hub .ad .hero{background:linear-gradient(135deg,#123f50,#1f6f8b);color:#fff;border-radius:12px;padding:20px;margin-bottom:14px}
#aaw-hub .ad .hero h1{color:#fff}#aaw-hub .ad .hero p{margin-bottom:0;color:#e5f1f5}
#aaw-hub .ad .pill{display:inline-block;border-radius:99px;padding:4px 10px;background:#e3f1f6;color:var(--c);font-size:.75em;font-weight:800}
#aaw-hub .ad .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#aaw-hub .ad .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
#aaw-hub .ad .stat{background:#fff;border:1px solid #d7e3ea;border-radius:9px;padding:10px;text-align:center}
#aaw-hub .ad .stat strong{display:block;font-size:1.25em;color:var(--c)}#aaw-hub .ad .stat span{font-size:.75em;color:#5a6b76}
#aaw-hub .ad .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#aaw-hub .ad .actions .btn{margin:0}
#aaw-hub .ad .btn.secondary{background:#fff;color:var(--c);border:1.5px solid var(--c)}
#aaw-hub .ad .btn:disabled{opacity:.45;cursor:not-allowed}
#aaw-hub .ad .progress{height:7px;background:#dce8ed;border-radius:8px;overflow:hidden;margin:10px 0 8px}
#aaw-hub .ad .progress span{display:block;height:100%;background:var(--c);transition:width .25s}
#aaw-hub .ad .case-intro{background:#fff;border:1px solid #d7e3ea;border-radius:10px;padding:14px;margin:12px 0}
#aaw-hub .ad .clue-grid,#aaw-hub .ad .choices{display:grid;gap:8px}
#aaw-hub .ad .clue{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px;border:1.5px solid #c5d5de;background:#fff}
#aaw-hub .ad .clue:hover:not(:disabled){border-color:var(--c)}
#aaw-hub .ad .clue .symbol{font-weight:800;color:var(--c);width:1em;text-align:center}
#aaw-hub .ad .clue small{display:block;color:#5a6b76;font-size:.85em;margin-top:2px}
#aaw-hub .ad .clue.revealed{border-color:#8bb5c5;background:#f1f8fa}#aaw-hub .ad .clue:disabled{cursor:default}
#aaw-hub .ad .answer{width:100%;text-align:left;padding:12px 14px;border:1.5px solid #c5d5de;background:#fff}
#aaw-hub .ad .answer:hover:not(:disabled){border-color:var(--c);background:#f3f9fb}
#aaw-hub .ad .answer.correct{border-color:var(--ok);background:#e8f5e9}#aaw-hub .ad .answer.incorrect{border-color:var(--bad);background:#ffebee}
#aaw-hub .ad .answer:disabled{cursor:default}
#aaw-hub .ad .feedback{padding:12px 14px;margin-top:12px;background:#fff;border-left:4px solid var(--c);border-radius:7px;font-size:.93em}
#aaw-hub .ad .feedback.good{border-color:var(--ok)}#aaw-hub .ad .feedback.warn{border-color:#d18a19}
#aaw-hub .ad .feedback strong{display:block;margin-bottom:4px}
#aaw-hub .ad .notice{background:#fff8ec;border:1px solid #f1d6a9;border-radius:9px;padding:11px 13px;font-size:.87em;color:#70420b;margin-top:14px}
#aaw-hub .ad .score{font-size:2.3em;font-weight:800;color:var(--c);line-height:1.1;margin:10px 0 4px}
#aaw-hub .ad .case-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}
#aaw-hub .ad .case-tile{background:#fff;border:1px solid #d7e3ea;border-radius:10px;padding:12px}
#aaw-hub .ad .case-tile strong{display:block;color:#123f50}#aaw-hub .ad .case-tile span{font-size:.8em;color:#5a6b76}
#aaw-hub .ad .case-tile.done{border-color:#8dbb91;background:#f1f8f1}
#aaw-hub .ad .refs p{font-size:.84em;margin-bottom:8px}
@media(max-width:520px){#aaw-hub .ad .case-list{grid-template-columns:1fr}#aaw-hub .ad .stat{padding:8px 4px}}
/*]]>*/</style>
<script>//<![CDATA[
(function(){
  var root=document.getElementById('aaw-hub'),cleanup=null;
  /* Internal game IDs. Not shown in the games; the website uses them for its leaderboard. */
  var CODES={wheel:'NARROW',blast:'TARGETED',run:'COVERAGE',whack:'TIMEOUT',catch:'SHIELD',clock:'SHORTER',allergy:'PENICILLIN',myth:'DELABEL',match:'PATHOGEN',dash:'DEESCALATE',dur:'DURATION',scr:'STEWARD'};
  /* Reports game activity (start/finish). Does nothing in the standalone file; the Vercel site listens for it to track plays and fill in codes. */
  function track(type,game,extra){try{var d={type:type,game:game};for(var k in extra)d[k]=extra[k];root.dispatchEvent(new CustomEvent('aaw',{bubbles:true,detail:d}))}catch(e){}}
  /* Reports a finished game and its score (used only by the website's leaderboard). Shows nothing. */
  function award(id,ok,need,score){
    track('finish',id,{unlocked:!!ok,code:ok?CODES[id]:null,score:score});
    return '';
  }
  function confetti(){
    var c=document.createElement('canvas');c.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5';root.appendChild(c);
    var w=c.width=root.clientWidth,h=c.height=root.clientHeight,x=c.getContext('2d'),P=[],t0=performance.now();
    for(var i=0;i<140;i++)P.push({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*5,c:['#1f6f8b','#f2c94c','#eb5757','#27ae60','#9b51e0'][i%5]});
    (function f(t){x.clearRect(0,0,w,h);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
      if(t-t0<2600&&c.parentNode)requestAnimationFrame(f);else if(c.parentNode)c.parentNode.removeChild(c)})(t0);
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function $(s){return root.querySelector(s)}
  function $$(s){return root.querySelectorAll(s)}
  var BACK='<button class="back">← All games</button>';
  function wireBack(){var b=$('.back');if(b)b.onclick=menu}
  function finish(title,score,total,msgs,extra){
    var p=score/total,msg=p===1?msgs[0]:p>=.7?msgs[1]:p>=.4?msgs[2]:msgs[3];
    return '<div class="card center">'+BACK+'<h2>'+title+'</h2><div class="big">'+score+' / '+total+'</div><p>'+msg+'</p>'+(extra||'')+
      '<button class="btn again">Play again</button><button class="btn ghost home">More games</button></div>';
  }
  var MSGS=['Excellent work.','Well done.','Good effort. Review the explanations to strengthen your knowledge.','Thank you for participating. Review the explanations and try again.'];

  /* ---------- MENU ---------- */
  var GAMES=[
    {ic:'💥',name:'Bug Blaster',d:'Treat each organism with the narrowest effective antibiotic.',fn:blaster,f:1,id:'blast',time:'1 minute',
     learn:'Matching common organisms to the narrowest effective antibiotic.',
     how:['Organisms move down the screen for 60 seconds.','Select an antibiotic below the game area (or press 1 to 5), then click or tap an organism to treat it.','The narrowest effective choice earns 100 points and lowers the resistance meter. A broader antibiotic that still works earns 25 points and raises it. An antibiotic without coverage makes the organism larger and faster.','The game ends early if three organisms reach the bottom or resistance reaches 100%.']},
    {ic:'🏃',name:'Antibiotic Runner',d:'Apply spectrum of activity as you move through the bloodstream.',fn:runner,f:1,id:'run',time:'Up to 1 minute',
     learn:'Spectrum of activity: which organisms common antibiotics do and do not cover.',
     how:['You are an antibiotic moving through the bloodstream, and organisms approach from the right.','Make contact with organisms your antibiotic covers. Jump over organisms it does not cover by pressing Space or the Up arrow, or by tapping the game area.','Each correct action earns 1 point. Hitting an organism your antibiotic does not cover, or jumping over one it does cover, costs one of three lives.','Your antibiotic changes every 5 points, and the speed increases every 10 seconds.','A coverage reference table is available below the game area.']},
    {ic:'⏱️',name:'Stop the Clock',d:'Select evidence-based treatment durations against the clock.',fn:clock,f:1,id:'clock',time:'About 2 minutes',
     learn:'Evidence-based antibiotic treatment durations.',
     how:['Each round describes a clinical scenario.','A marker moves back and forth across a 0 to 21 day scale. Select Stop (or press Space) when it reaches the recommended duration.','Points are based on how close you stop to the target. There are six rounds, and the marker speeds up each round.']},
    {ic:'🔨',name:'Order Whack',d:'Identify inappropriate antibiotic orders as they appear.',fn:whack,f:1,id:'whack',time:'1 minute',
     learn:'Recognizing appropriate and inappropriate antibiotic orders.',
     how:['Antibiotic orders appear in the grid for 60 seconds.','Select each inappropriate order (+100 points). Leave appropriate orders alone.','Selecting an appropriate order costs 50 points, and letting an inappropriate order pass costs 25 points.','A summary of items to review is shown at the end.']},
    {ic:'🛡️',name:'Stewardship Catch',d:'Catch stewardship best practices and avoid the pitfalls.',fn:catcher,f:1,id:'catch',time:'1 minute',
     learn:'Distinguishing stewardship best practices from common pitfalls.',
     how:['Items fall for 60 seconds. Green items are good practices, and red items are practices to avoid.','Move the paddle by dragging within the game area or by using the left and right arrow keys.','Each green item caught earns 50 points, with a multiplier for consecutive catches. Catching a red item costs one of three lives.']},
    {ic:'🎡',name:'Stewardship Wheel',d:'Solve word puzzles built around key stewardship principles.',fn:wheel,f:1,id:'wheel',time:'About 2 minutes',
     learn:'Core antimicrobial stewardship principles and terminology.',
     how:['Select Spin to land on a dollar value.','Choose a consonant. Each time it appears in the puzzle, the value is added to your round total.','Buy a vowel for $250, or select Solve when you know the phrase.','Landing on Lose a Turn, or choosing a consonant that is not in the puzzle, counts as a strike. Three strikes end the puzzle.','There are two puzzles, each followed by a brief teaching point.']},
    {ic:'🔍',name:'Allergy Detective',d:'Evaluate penicillin allergy labels in four patient cases.',fn:detective,f:1,id:'allergy',time:'5 to 8 minutes',
     learn:'Evaluating penicillin allergy histories and how allergy labels affect antibiotic selection.',
     how:['Work through four patient cases with a reported penicillin allergy.','In each case, review the allergy history, calculate the modified PEN-FAST score, choose an evaluation pathway, and make an antibiotic decision.','Feedback with the rationale follows each decision, and key takeaways and references appear at the end.']},
    {ic:'🧠',name:'Myth or Fact',d:'Test common beliefs about antibiotic use.',fn:function(){quiz('Myth or Fact',MYTHS,'myth')},id:'myth',time:'About 2 minutes',
     learn:'Common misconceptions about antibiotics, allergies, and testing.',
     how:['Read each statement and select Myth or Fact.','An explanation and source appear after each answer.','There are eight statements.']},
    {ic:'🎯',name:'Bug–Drug Match',d:'Pair each organism with its preferred targeted therapy.',fn:match,id:'match',time:'About 1 minute',
     learn:'Preferred targeted therapy for common organisms.',
     how:['Select an organism in the left column, then select its preferred targeted therapy in the right column.','Each correct match shows a brief teaching point.','There are seven pairs.']},
    {ic:'📉',name:'De-escalation Dash',d:'Choose the narrowest effective option once cultures return.',fn:function(){quiz('De-escalation Dash',DASH,'dash')},id:'dash',time:'About 2 minutes',
     learn:'De-escalating therapy once culture results and the clinical course are known.',
     how:['Each case presents a culture result or clinical update.','Select the narrowest effective option.','There are six cases, each followed by an explanation and source.']},
    {ic:'📅',name:'Duration Station',d:'Select evidence-based treatment durations.',fn:function(){quiz('Duration Station',DUR,'dur')},id:'dur',time:'About 2 minutes',
     learn:'Evidence-based treatment durations for common infections.',
     how:['Read each scenario and select the evidence-based duration.','There are six questions, each followed by an explanation and source.']},
    {ic:'🔤',name:'Stewardship Scramble',d:'Unscramble key stewardship terms.',fn:scramble,id:'scr',time:'About 1 minute',
     learn:'Key antimicrobial stewardship terms.',
     how:['Unscramble the letters to form a stewardship term, then select Check (or press Enter).','Select Hint for a definition, or Skip to reveal the answer.','There are six words.']}
  ];
  function menu(){
    if(cleanup){cleanup();cleanup=null}
    var h='<div class="card"><h2>Stewardship Learning Challenge</h2><p class="sub">Antibiotic Awareness Week: '+GAMES.length+' short, evidence-based games. Select a game to view its instructions.</p><div class="menu">';
    GAMES.forEach(function(g,i){h+='<button class="tile'+(g.f?' feat':'')+'" data-i="'+i+'">'+'<div class="ic">'+g.ic+'</div><h3>'+g.name+'</h3><p>'+g.d+'</p></button>'});
    root.innerHTML=h+'</div></div>';
    $$('.tile').forEach(function(b){b.onclick=function(){intro(GAMES[+b.dataset.i])}});
  }

  /* ---------- QUIZ ENGINE (Myth/Fact, Dash, Duration) ---------- */
  var MYTHS=[
    {t:'Myth or Fact',q:'About 10% of patients report a penicillin allergy, and most of them are truly allergic.',o:['Myth','Fact'],a:0,e:'About 10% report it, but fewer than 1 in 10 of them are truly allergic when evaluated. Delabeling opens up first-line, narrower-spectrum options.',s:'CDC, Clinical Features of Penicillin Allergy'},
    {t:'Myth or Fact',q:"A patient with a penicillin allergy label can't receive cefazolin.",o:['Myth','Fact'],a:0,e:'Cefazolin has a unique R1 side chain and negligible cross-reactivity with penicillins. A structurally dissimilar cephalosporin such as cefazolin can be given without testing, even after penicillin anaphylaxis. The exception is a severe delayed reaction (such as SJS/TEN or DRESS), which needs specialist evaluation.',s:'Khan et al., Drug Allergy Practice Parameter, J Allergy Clin Immunol 2022'},

     risk:{q:'Using the modified PEN-FAST clinical decision rule, what score applies to this history?',correct:0,why:'The history describes gastrointestinal intolerance only, not one of the listed allergic reaction phenotypes. The patient has no listed severe delayed/organ-specific reaction (+0), no reaction within 5 years (+0), no anaphylaxis/angioedema (+0), and no treatment or hospitalization (+0). Total = 0. Document the history as intolerance rather than immune-mediated allergy, consistent with local policy.'},
     pathway:{q:'What is the most appropriate documentation action?',opts:['Keep an anaphylaxis label','Clarify and correct the record to describe intolerance rather than allergy, following local policy','Add an allergy to every beta-lactam','Refer every patient with nausea for skin testing'],correct:1,why:'The record should accurately distinguish intolerance from allergy. Follow local procedures for correcting the label and communicate the history to the treating team.'},
     drug:{q:'What is the stewardship opportunity?',opts:['Use broader therapy indefinitely','Avoid all beta-lactams','Choose the guideline-concordant antibiotic without treating intolerance as an IgE allergy','Use vancomycin for all infections'],correct:2,why:'An inaccurate allergy label can drive broader or less effective therapy. Correcting the record can help preserve first-line treatment options.'},
     takeaway:'GI intolerance alone is not an immune-mediated allergy. Correct documentation can prevent unnecessary broad-spectrum alternatives.'}
  ];
  function detective(){
    var cases=AD_CASES,state;
    root.innerHTML='<div class="card ad">'+BACK+'<div class="ad-screen"></div></div>';
    wireBack();
    var screen=$('.ad-screen');
    function start(){state={caseIndex:0,score:0,caseScores:[],clues:[],answers:{}};renderHome()}
    function renderHome(){
      var done=state.caseScores.length;
      screen.innerHTML='<div class="hero"><div class="eyebrow" style="color:#bfe3ee">Antibiotic Awareness Week</div><h1>Allergy Detective</h1><p>Review four patient cases with a reported penicillin allergy. Gather the history, assess the risk, choose an evaluation pathway, and make the antibiotic decision.</p></div>'+
        '<div class="row"><span class="pill">4 PATIENT CASES</span><span class="muted">'+done+' of 4 completed</span></div>'+
        '<div class="stats"><div class="stat"><strong>4</strong><span>Patient cases</span></div><div class="stat"><strong>5–8 min</strong><span>Estimated time</span></div><div class="stat"><strong>'+state.score+'</strong><span>Points earned</span></div></div>'+
        '<div class="case-list">'+cases.map(function(c,i){var d=state.caseScores[i]!==undefined;return '<div class="case-tile '+(d?'done':'')+'"><strong>'+(d?'✓ ':'')+esc(c.title)+'</strong><span>Patient case</span></div>'}).join('')+'</div>'+
        '<div class="notice"><strong>Clinical note:</strong> This activity is for education only. Evaluation eligibility and antibiotic selection must follow current practice parameters, patient-specific factors, and local institutional protocols.</div>'+
        '<div class="actions"><button class="btn" id="ad-begin">'+(done?'Continue':'Begin first case')+'</button></div>';
      screen.querySelector('#ad-begin').onclick=function(){state.caseIndex=Math.min(done,3);beginCase()};
    }
    function beginCase(){state.clues=[];state.answers={};renderBrief()}
    function header(step){
      return '<div class="row"><span class="pill">CASE '+(state.caseIndex+1)+' OF 4</span><span class="muted">Score: '+state.score+'</span></div>'+
        '<div class="progress"><span style="width:'+(step/4*100)+'%"></span></div><div class="meta"><span>Patient case</span><span>Step '+step+' of 4</span></div>';
    }
    function renderBrief(){
      var c=cases[state.caseIndex];
      screen.innerHTML=header(0)+'<div class="case-intro"><span class="eyebrow">PATIENT BRIEFING</span><h2>'+esc(c.title)+'</h2><p>'+esc(c.brief)+'</p><p class="muted"><strong>Clinical problem:</strong> '+esc(c.infection)+'</p></div>'+
        '<h3>Your task</h3><p>Evaluate the allergy label before recommending a treatment plan. Start by reviewing the patient\'s history.</p>'+
        '<div class="actions"><button class="btn" id="ad-inv">Review the history</button><button class="btn secondary" id="ad-quit">Back to case list</button></div>';
      screen.querySelector('#ad-inv').onclick=renderClues;screen.querySelector('#ad-quit').onclick=renderHome;
    }
    function renderClues(){
      var c=cases[state.caseIndex],opened=state.clues.length;
      screen.innerHTML=header(1)+'<h2>Step 1: Review the allergy history</h2><p class="sub">Select each question to reveal the patient\'s response. Review all of them to continue.</p>'+
        '<div class="clue-grid">'+c.clues.map(function(cl,i){var seen=state.clues.indexOf(i)!==-1;
          return '<button class="clue '+(seen?'revealed':'')+'" data-clue="'+i+'" '+(seen?'disabled':'')+'><span class="symbol">'+(seen?'✓':'+')+'</span><span class="clue-text"><strong>'+esc(cl[0])+'</strong><small>'+(seen?esc(cl[1]):'Select to reveal the response')+'</small></span></button>'}).join('')+'</div>'+
        '<p class="muted" style="margin-top:10px">'+opened+' of '+c.clues.length+' responses reviewed</p>'+
        '<div class="actions"><button class="btn" id="ad-risk" '+(opened<c.clues.length?'disabled':'')+'>Assess the reaction</button><button class="btn secondary" id="ad-back">Back</button></div>';
      Array.prototype.forEach.call(screen.querySelectorAll('[data-clue]'),function(b){b.onclick=function(){var i=+b.getAttribute('data-clue');if(state.clues.indexOf(i)<0){state.clues.push(i);state.score+=2}renderClues()}});
      screen.querySelector('#ad-risk').onclick=function(){renderQuestion('risk')};screen.querySelector('#ad-back').onclick=renderBrief;
    }
    function renderQuestion(key){
      var c=cases[state.caseIndex],q=c[key],step=key==='risk'?2:key==='pathway'?3:4,answer=state.answers[key];
      var penfast='<div class="case-intro"><h3 style="margin-bottom:8px">Modified PEN-FAST Clinical Decision Rule</h3>'+
        '<p class="muted">Use the criteria below to calculate the score. The first question identifies who is reporting the history and does not add points.</p><div class="choices">'+
        '<div><strong>1. Who is reporting the penicillin allergy?</strong><p class="muted">Patient, family, or other caregiver (no points)</p></div>'+
        '<div><strong>2. Was the allergy ever reported as one of the following?</strong><ul class="muted"><li>Rash, hives, itching: 0 points</li><li>Serum sickness / drug-induced fever: +4</li><li>DRESS / AGEP: +4</li><li>Interstitial nephritis / drug-induced liver injury: +4</li><li>SJS / TEN: +4</li><li>Unknown or none of the above: 0 points</li></ul></div>'+
        '<div class="row"><strong>3. Reaction within the past 5 years?</strong><span class="pill">Yes +2 • No 0 • Unknown +1</span></div>'+
        '<div class="row"><strong>4. Anaphylaxis or angioedema?</strong><span class="pill">Yes +3 • No 0 • Unknown +1</span></div>'+
        '<div class="row"><strong>5. Did the reaction require treatment or hospitalization?</strong><span class="pill">Yes +1 • No 0 • Unknown (no points specified)</span></div></div>'+
        '<p class="muted" style="margin:10px 0 0">Add the applicable points. Severe delayed or organ-specific reactions are an important exception: do not use a calculated score to send these patients through routine challenge algorithms.</p></div>';
      var opts=key==='risk'?Array.apply(null,{length:11}).map(function(_,n){return 'Modified PEN-FAST score: '+n}):q.opts;
      screen.innerHTML=header(step)+(key==='risk'?'<span class="eyebrow">STEP 2: RISK ASSESSMENT</span>'+penfast:'<span class="eyebrow">'+(key==='pathway'?'STEP 3: EVALUATION PATHWAY':'STEP 4: ANTIBIOTIC DECISION')+'</span>')+
        '<h2>'+esc(q.q)+'</h2><div class="choices">'+opts.map(function(o,i){var cls='';if(answer!==undefined){if(i===q.correct)cls='correct';else if(i===answer)cls='incorrect'}
          return '<button class="answer '+cls+'" data-answer="'+i+'" '+(answer!==undefined?'disabled':'')+'>'+esc(String(o))+'</button>'}).join('')+'</div>'+
        (answer!==undefined?
          '<div class="feedback '+(answer===q.correct?'good':'warn')+'"><strong>'+(answer===q.correct?'Correct':'Incorrect. Review the rationale.')+'</strong>'+esc(q.why)+'</div>'+
          '<div class="actions"><button class="btn" id="ad-next">'+(key==='risk'?'Choose an evaluation pathway':key==='pathway'?'Make the antibiotic decision':'Complete this case')+'</button><button class="btn secondary" id="ad-back">Back to history</button></div>':
          '<p class="muted" style="margin-top:12px">'+(key==='risk'?'Use the criteria above to calculate the total, then select the score. You can go back to review the history.':'Select the best answer. Feedback appears before you continue.')+'</p>'+
          '<div class="actions"><button class="btn secondary" id="ad-back">Back to history</button></div>');
      if(answer===undefined){Array.prototype.forEach.call(screen.querySelectorAll('[data-answer]'),function(b){b.onclick=function(){var n=+b.getAttribute('data-answer');state.answers[key]=n;if(n===q.correct)state.score+=10;renderQuestion(key)}})}
      else screen.querySelector('#ad-next').onclick=function(){if(key==='risk')renderQuestion('pathway');else if(key==='pathway')renderQuestion('drug');else completeCase()};
      screen.querySelector('#ad-back').onclick=renderClues;
    }
    function completeCase(){
      var c=cases[state.caseIndex],correct=['risk','pathway','drug'].filter(function(k){return state.answers[k]===c[k].correct}).length;
      state.caseScores[state.caseIndex]=correct;
      screen.innerHTML=header(4)+'<div class="case-intro"><span class="eyebrow">CASE COMPLETE</span><h2>'+esc(c.title)+'</h2><p>'+esc(c.takeaway)+'</p></div>'+
        '<div class="stats"><div class="stat"><strong>'+correct+'/3</strong><span>Decisions correct</span></div><div class="stat"><strong>+'+(state.clues.length*2+correct*10)+'</strong><span>Case points</span></div><div class="stat"><strong>'+state.score+'</strong><span>Total score</span></div></div>'+
        '<div class="actions"><button class="btn" id="ad-nextcase">'+(state.caseIndex===3?'View final results':'Next case')+'</button><button class="btn secondary" id="ad-board">Case list</button></div>';
      screen.querySelector('#ad-nextcase').onclick=function(){if(state.caseIndex===3)renderFinal();else{state.caseIndex++;beginCase()}};
      screen.querySelector('#ad-board').onclick=renderHome;
    }
    function renderFinal(){
      var total=state.caseScores.reduce(function(a,b){return a+b},0);
      screen.innerHTML='<div class="hero"><div class="eyebrow" style="color:#bfe3ee">ALL CASES COMPLETE</div><h1>Allergy Detective: results</h1><p>You have completed all four patient cases.</p></div>'+
        '<div class="score">'+state.score+' points</div><p class="sub">Clinical decisions correct: '+total+' of 12</p>'+
        award('allergy',true,'Complete all four cases',state.score)+
        '<div class="case-list">'+cases.map(function(c,i){var n=state.caseScores[i]||0;return '<div class="case-tile '+(n===3?'done':'')+'"><strong>'+esc(c.title)+'</strong><span>'+n+' of 3 decisions correct</span></div>'}).join('')+'</div>'+
        '<div class="case-intro"><span class="eyebrow">KEY TAKEAWAYS</span><h2>Putting penicillin allergy assessment into practice</h2>'+
        '<p><strong>1. Use PEN-FAST to help assess risk.</strong><br>The modified PEN-FAST clinical decision rule can help risk-stratify patients with reported penicillin allergies and identify patients who may be appropriate for further evaluation. However, clinical history remains essential. Standard risk-stratification and challenge algorithms do not apply to patients with severe delayed immunologic or organ-specific reactions, such as SCARs, hemolytic anemia, drug-induced liver injury, or acute interstitial nephritis.</p>'+
        '<p><strong>2. Penicillin and cephalosporin cross-reactivity is not a class-wide phenomenon.</strong><br>Cross-reactivity is primarily related to similarities in beta-lactam side chains, particularly the R1 side chain, rather than simply the shared beta-lactam ring. Cefazolin has a unique R1 side chain and can generally be used in many patients with a history of penicillin allergy, including those with prior penicillin anaphylaxis, when there is no history of a severe delayed reaction and the clinical context supports its use.</p>'+
        '<p style="margin-bottom:0"><strong>3. Accurate allergy assessment supports antimicrobial stewardship.</strong><br>Clarifying and appropriately evaluating allergy labels can preserve access to preferred first-line antibiotics, reduce unnecessary use of alternative agents, and support more targeted antimicrobial therapy.</p></div>'+
        '<div class="case-intro refs"><span class="eyebrow">REFERENCES</span>'+
        '<p>1. Khan DA, Banerji A, Blumenthal KG, et al. Drug allergy: A 2022 practice parameter update. <em>J Allergy Clin Immunol</em>. 2022;150(6):1333-1393. doi:10.1016/j.jaci.2022.08.028.</p>'+
        '<p>2. Copaescu AM, Vogrin S, James F, et al. Efficacy of a Clinical Decision Rule to Enable Direct Oral Challenge in Patients With Low-Risk Penicillin Allergy: The PALACE Randomized Clinical Trial. <em>JAMA Intern Med</em>. 2023;183(9):944-952. doi:10.1001/jamainternmed.2023.2986.</p>'+
        '<p>3. Hoffmann WJ, Patel S, Lee EJ, et al. Implementation and performance of a nurse administered modified PEN-FAST clinical decision rule in the electronic health record. <em>Antimicrob Steward Healthc Epidemiol</em>. 2025;5(1):e159. doi:10.1017/ash.2025.10066.</p></div>'+
        '<div class="notice"><strong>Clinical reminder:</strong> This educational activity does not replace patient-specific assessment, specialist consultation, or institutional allergy-evaluation protocols.</div>'+
        '<div class="actions"><button class="btn" id="ad-again">Play again</button><button class="btn secondary" id="ad-home">All games</button></div>';
      screen.querySelector('#ad-again').onclick=start;screen.querySelector('#ad-home').onclick=menu;
    }
    start();
  }

  menu();
})();

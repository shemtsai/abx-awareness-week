<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Admin: Antibiotic Awareness Week</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="admin">
    <main>
      <section class="card">
        <h2>Antibiotic Awareness Week admin</h2>
        <form id="key-form">
          <label>Admin key <input name="key" type="password" required /></label>
          <button type="submit">Load results</button>
        </form>
        <p id="status" class="muted"></p>
      </section>

      <section class="card" id="leaders" hidden>
        <div class="row"><h2>Leaderboard</h2><button type="button" class="ghost" id="csv">Download CSV</button></div>
        <p class="muted" id="leader-note"></p>
        <table><thead><tr><th>#</th><th>Name / initials</th><th class="num">Games completed</th><th>Games</th><th>Last completed</th></tr></thead><tbody></tbody></table>
      </section>

      <section class="card" id="games" hidden>
        <h2>Game activity</h2>
        <p class="muted" id="games-note"></p>
        <table><thead><tr><th>Game</th><th class="num">Started</th><th class="num">Finished</th><th class="num">Hit target</th><th class="num">Target rate</th></tr></thead><tbody></tbody></table>
      </section>
      <section class="card" id="feedback" hidden>
        <h2>Private feedback</h2>
        <p class="muted" id="feedback-note"></p>
        <table><thead><tr><th>When</th><th>From</th><th>Feedback</th></tr></thead><tbody></tbody></table>
      </section>

      <section class="card" id="comments" hidden>
        <h2>Public comments</h2>
        <p class="muted" id="comments-note"></p>
        <table><thead><tr><th>When</th><th>From</th><th>Comment</th><th></th></tr></thead><tbody></tbody></table>
      </section>
    </main>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
